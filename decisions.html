<!DOCTYPE html>
<!-- Decisions (Lex, 23 Oct 2026): the phone page for the Claude autopilot. One card at a time from the WPS script
     (file Autopilot, ops auList / auDecide / auUndo, this device's key). Swipe right = yes, left = no (asks why; the
     answer becomes a booking-reader lesson), up = later, tap = the whole card: choices, change an email's words, speak.
     Nothing is sent to anyone unless Lex says yes here. Plan: project doc claude/WPS_Autopilot_Plan.md. -->
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>WPS Decisions</title>
<meta name="theme-color" content="#141D3D" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Decisions" />
<link rel="apple-touch-icon" href="icons/decisions-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/decisions-192.png" />
<link rel="manifest" href="decisions.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#141D3D; --navy:#1F2D5A; --navy2:#2B3D74; --line:#3A4670; --card:#FFFFFF; --ink:#1B1D21; --soft:#5C6470; --paper:#F5F6F8;
    --text:#F3F5FA; --text2:#D6DDF2; --text3:#B7C6F0; --coral:#E0684B; --coral-hl:#F2937D; --no:#F08A80; --no-text:#F8B4AD; --dark:#1A2133; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif; -webkit-text-size-adjust:100%; }
  body{ min-height:100vh; min-height:100dvh; }
  button,input,textarea{ font-family:inherit; }
  .wrap{ max-width:560px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:14px; min-height:100vh; min-height:100dvh; }
  header{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .mark{ width:40px; height:40px; flex:0 0 40px; border-radius:50%; background:var(--coral); display:flex; align-items:center; justify-content:center; }
  .mark svg{ width:24px; height:24px; }
  .t1{ font-size:22px; font-weight:700; line-height:1.1; }
  .t2{ font-size:12px; color:var(--text3); }
  .count{ background:var(--coral); color:#fff; font-weight:700; font-size:15px; border-radius:999px; padding:4px 12px; white-space:nowrap; }
  .count.zero{ background:var(--navy2); }
  .stage{ position:relative; flex:1 1 auto; display:flex; flex-direction:column; min-height:420px; margin-bottom:12px; }
  .under{ position:absolute; left:14px; right:14px; top:10px; bottom:-10px; background:var(--navy2); border-radius:22px; }
  .card{ position:relative; flex:1 1 auto; background:var(--card); color:var(--ink); border-radius:22px; padding:20px; display:flex; flex-direction:column; gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.35); touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; will-change:transform; }
  .card.fly{ transition:transform .25s ease-out, opacity .25s ease-out; }
  .card.back{ transition:transform .2s ease-out; }
  .tagrow{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tag{ font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; border-radius:999px; padding:4px 10px; }
  .tag.booking{ background:#FBE7E1; color:#9A3B24; } .tag.reply{ background:#E3E8F7; color:#1F2D5A; } .tag.ask,.tag.flagged{ background:#FFF4CC; color:#5A4500; } .tag.info{ background:#FDECEA; color:#8C1D18; } .tag.later{ background:#E9ECF2; color:#3A4670; }
  .when{ font-size:13px; color:var(--soft); }
  .title{ font-size:22px; font-weight:700; color:var(--navy); line-height:1.25; }
  .place{ font-size:15px; line-height:1.45; }
  .rows{ background:var(--paper); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:6px; font-size:14px; line-height:1.4; }
  .rows div{ display:flex; gap:8px; } .rows .k{ color:var(--soft); min-width:74px; flex:0 0 74px; } .rows .v{ font-weight:600; overflow-wrap:anywhere; }
  .why{ font-size:13px; color:var(--soft); line-height:1.45; }
  .body-prev{ white-space:pre-wrap; font-size:15px; line-height:1.45; background:var(--paper); border-radius:12px; padding:12px; }
  .tapmore{ align-self:flex-start; font-size:14px; color:var(--navy); font-weight:600; background:none; border:0; padding:8px 0; min-height:44px; text-decoration:underline; cursor:pointer; }
  .stamp{ position:absolute; top:22px; font-size:22px; font-weight:800; letter-spacing:.08em; padding:4px 12px; border-radius:10px; border:3px solid; opacity:0; pointer-events:none; }
  .stamp.yes{ right:18px; color:#1E6B3A; border-color:#1E6B3A; transform:rotate(8deg); } .stamp.no{ left:18px; color:#B3261E; border-color:#B3261E; transform:rotate(-8deg); }
  .stamp.later{ left:50%; transform:translateX(-50%); color:#3A4670; border-color:#3A4670; top:auto; bottom:22px; }
  .hints{ display:flex; justify-content:space-between; font-size:12px; color:var(--text3); padding:0 6px; }
  .btns{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .btn{ min-height:56px; border-radius:16px; font-size:17px; font-weight:700; cursor:pointer; }
  .b-no{ border:2px solid var(--no); background:transparent; color:var(--no-text); }
  .b-later{ border:2px solid var(--line); background:var(--navy2); color:var(--text2); }
  .b-yes{ border:0; background:var(--coral); color:#fff; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .toast{ min-height:22px; text-align:center; font-size:14px; color:var(--coral-hl); line-height:1.4; }
  .toast button{ background:none; border:0; color:#fff; text-decoration:underline; font-size:14px; font-weight:600; cursor:pointer; padding:6px; }
  .empty{ flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px; background:var(--navy); border-radius:22px; }
  .empty .ok{ width:56px; height:56px; border-radius:50%; background:var(--coral); display:flex; align-items:center; justify-content:center; }
  .empty h2{ margin:0; font-size:22px; } .empty p{ margin:0; color:var(--text2); font-size:15px; line-height:1.45; }
  .sec{ font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); margin-top:6px; }
  .done{ background:var(--dark); border:1px solid #2B3550; border-radius:16px; padding:12px 14px; display:flex; align-items:center; gap:12px; }
  .done .tx{ display:flex; flex-direction:column; gap:2px; flex:1 1 auto; min-width:0; }
  .done .who{ font-size:12px; font-weight:700; color:var(--text3); } .done .who.auto{ color:var(--coral-hl); }
  .done .what{ font-size:15px; font-weight:600; overflow-wrap:anywhere; } .done .res{ font-size:13px; color:#A8B1C2; overflow-wrap:anywhere; }
  .ghost{ min-height:44px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:15px; font-weight:600; cursor:pointer; }
  .score{ background:var(--dark); border:1px solid #2B3550; border-radius:16px; padding:12px 14px; font-size:14px; line-height:1.5; color:var(--text2); }
  .msg{ background:var(--navy); border-radius:16px; padding:16px; font-size:15px; line-height:1.5; color:var(--text2); }
  .msg a{ color:var(--coral-hl); }
  /* sheets */
  .sheet{ position:fixed; inset:0; background:var(--bg); z-index:10; overflow-y:auto; }
  .sheet .wrap{ min-height:auto; }
  .top{ display:flex; align-items:center; gap:10px; }
  .back{ background:none; border:0; color:var(--text3); font-size:15px; min-height:44px; padding:0 4px; cursor:pointer; }
  .panel{ background:var(--card); color:var(--ink); border-radius:22px; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .choice{ min-height:48px; border-radius:12px; font-size:16px; font-weight:600; text-align:left; padding:10px 14px; background:#fff; color:var(--navy); border:2px solid #C9CFDA; cursor:pointer; }
  .choice:hover{ border-color:var(--navy); }
  label.l{ font-size:13px; color:var(--soft); }
  textarea.edit{ min-height:200px; border:1px solid #C9CFDA; border-radius:12px; padding:12px; font-size:16px; line-height:1.45; color:var(--ink); resize:vertical; width:100%; }
  .row2{ display:flex; gap:8px; }
  .light{ flex:1 1 0; min-height:44px; border-radius:12px; border:1px solid #C9CFDA; background:#fff; color:var(--navy); font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; text-decoration:none; }
  .light.on{ background:var(--coral); color:#fff; border-color:var(--coral); }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ min-height:44px; padding:0 14px; border-radius:999px; font-size:15px; font-weight:600; background:transparent; color:var(--text); border:2px solid var(--line); cursor:pointer; }
  .chip.on{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .whyin{ display:flex; gap:8px; }
  .whyin input{ flex:1 1 auto; min-width:0; min-height:48px; border-radius:12px; border:1px solid var(--line); background:var(--dark); color:var(--text); padding:0 12px; font-size:16px; }
  .mic{ width:52px; flex:0 0 52px; border-radius:12px; border:0; background:var(--coral); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .mic.on{ background:#fff; color:var(--coral); }
  .grid2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .lessonprev{ font-size:14px; color:var(--coral-hl); min-height:20px; line-height:1.4; }
  [hidden]{ display:none !important; }
  @media (min-width:700px){ .stage{ min-height:480px; } }
</style>
</head>
<body>
<div class="wrap" id="main">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="29 470 300 300"><g fill="none" stroke="#141D3D" stroke-width="20"><path d="M88 722 V612 A91 91 0 0 1 270 612 V722"/><path d="M120 722 V614 A59 59 0 0 1 238 614 V722"/><line x1="58" y1="722" x2="300" y2="722"/></g><circle cx="221" cy="678" r="13" fill="#141D3D"/></svg></span>
      <div><div class="t1">Decisions</div><div class="t2" id="mode">Loading…</div></div>
    </div>
    <span class="count zero" id="count">–</span>
  </header>
  <div id="area"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="recent"></div>
  <div style="text-align:center"><a href="./?from=decisions" style="color:var(--text3);font-size:14px">Open the dashboard</a></div>
</div>

<div class="sheet" id="detail" hidden><div class="wrap" id="detailIn"></div></div>
<div class="sheet" id="whysheet" hidden><div class="wrap" id="whyIn"></div></div>

<script src="wpslink.js"></script>
<script>
"use strict";
const S = { cards: [], recent: [], score: {}, mode: "", phase: 0, busy: false, loaded: false, err: "", lastUndo: null, why: { chip: "", note: "" } };
const KIND_TAG = { booking: "Booking", reply: "Reply to send", ask: "Needs your answer", info: "Warning" };
const CAT_WORD = { new: "new jobs", change: "date changes", time: "time confirmations", tenants: "tenant details", cancel: "cancellations", flagged: "checks", reply: "replies", ask: "questions", trick: "warnings" };
const CHIPS = [["notbooking","Not a booking"],["wrongjob","Wrong job"],["wrongdate","Wrong date or time"],["oldtenants","Tenants are old"],["already","Already done"],["mine","I'll deal with it"],["other","Something else"]];
const CHIP_LESSON = { notbooking:"Lesson: emails like this are not bookings.", wrongjob:"Lesson: check the flat number and type before matching a job.", wrongdate:"Lesson: read the date from the newest email, not quoted text.", oldtenants:"Lesson: these tenant details can be from an earlier tenancy; ask the agent.", already:"Lesson: if the job already has this, say so and queue nothing.", mine:"No lesson: you'll handle this one yourself.", other:"Say or type what's wrong and it becomes the lesson." };
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ago(iso){ const t = Date.parse(iso||""); if (!t) return ""; const m = Math.round((Date.now()-t)/60000); if (m < 1) return "just now"; if (m < 60) return m+" min ago"; const h = Math.round(m/60); if (h < 24) return h+" h ago"; return new Date(t).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); }
function toast(html){ $("toast").innerHTML = html || ""; }

// ---------- data ----------
async function load(quiet){
  if (!WPSLink.key()){ S.loaded = true; S.err = "nokey"; render(); return; }
  if (!quiet){ $("mode").textContent = "Loading…"; }
  const d = await WPSLink.call("auList");
  S.loaded = true;
  if (!d || !d.ok){ S.err = (d && d.error) || "Couldn't reach the WPS script"; render(); return; }
  S.err = ""; S.cards = d.cards || []; S.recent = d.recent || []; S.score = d.score || {}; S.mode = d.mode; S.phase = d.phase;
  render();
}
async function decide(id, answer, extra){
  if (S.busy) return; S.busy = true;
  const card = S.cards.find(c => c.id === id);
  const d = await WPSLink.call("auDecide", Object.assign({ id, answer }, extra || {}));
  S.busy = false;
  if (!d || !d.ok){
    toast(esc((d && d.error) || "Not saved. Try again."));
    await load(true); return false;
  }
  const what = answer === "later" ? "Later: kept in the list, no more alerts for it." : answer === "no" ? (d.lesson ? "No. Lesson saved." : "No. Dropped.") : esc(d.result || "Done.");
  S.lastUndo = (answer === "yes" || answer === "choice") && card && card.kind === "booking" ? id : null;
  toast(what + (S.lastUndo ? ` <button onclick="undo('${id}')">Undo</button>` : ""));
  await load(true); return true;
}
async function undo(id){
  if (S.busy) return; S.busy = true;
  const d = await WPSLink.call("auUndo", { id });
  S.busy = false;
  toast(d && d.ok ? "Undone: " + esc(d.result || "") : esc((d && d.error) || "Couldn't undo."));
  await load(true);
}

// ---------- main view ----------
function rowsHtml(rows){ return (rows||[]).length ? `<div class="rows">${rows.map(r => `<div><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join("")}</div>` : ""; }
function cardHtml(c){
  const tag = c.status === "later" ? `<span class="tag later">Later</span>` : "";
  const cls = c.cat === "flagged" ? "flagged" : c.kind;
  const prev = c.kind === "reply" ? `<div class="body-prev">${esc(c.body)}</div>` : "";
  return `<div class="card" id="top" tabindex="0" aria-label="${esc(c.title)}">
    <span class="stamp yes">YES</span><span class="stamp no">NO</span><span class="stamp later">LATER</span>
    <div class="tagrow"><span class="tag ${cls}">${esc(c.cat === "flagged" ? "Check this" : KIND_TAG[c.kind] || "Card")}</span>${tag}<span class="when">${esc(ago(c.made))}</span></div>
    <div class="title">${esc(c.title)}</div>
    ${c.place ? `<div class="place">${esc(c.place)}</div>` : ""}
    ${rowsHtml(c.rows)}${prev}
    ${c.why ? `<div class="why">${esc(c.why)}</div>` : ""}
    ${c.question ? `<div class="why"><b>${esc(c.question)}</b> Tap to answer.</div>` : ""}
    <div style="flex:1 1 auto"></div>
    <button class="tapmore" onclick="openDetail()">${c.kind === "reply" ? "Tap to change the words" : c.kind === "ask" ? "Tap to write the reply" : c.question ? "Tap to choose" : "Tap to see the email and more"}</button>
  </div>`;
}
function scoreHtml(){
  const k = Object.keys(S.score || {}); if (!k.length) return "";
  return `<div class="score"><div class="sec" style="margin:0 0 4px">Last 7 days</div>${k.map(c => { const s = S.score[c]; return `${esc(CAT_WORD[c]||c)}: ${s.cards} card${s.cards===1?"":"s"}, ${s.yes} yes as written, ${s.changed} changed, ${s.no} no, ${s.auto} by autopilot${s.undone?", "+s.undone+" undone":""}`; }).join("<br>")}</div>`;
}
function render(){
  const n = S.cards.length;
  $("count").textContent = S.loaded && !S.err ? n + " waiting" : "–";
  $("count").className = "count" + (n ? "" : " zero");
  $("mode").textContent = S.err ? "Not connected" : S.mode === "claude" ? "Claude autopilot · phase " + S.phase : S.loaded ? "Manual (switch is off)" : "Loading…";
  let h = "";
  if (S.err === "nokey") h = `<div class="msg">This phone isn't linked to the WPS script yet. Open the <a href="./?from=decisions">dashboard</a>, go to More &gt; Device key and paste this device's key, then come back.</div>`;
  else if (S.err) h = `<div class="msg">${esc(S.err)}. <button class="ghost" onclick="load()">Try again</button></div>`;
  else if (!S.loaded) h = `<div class="msg">Loading…</div>`;
  else if (!n) h = `<div class="empty"><div class="ok"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>All done</h2><p>${S.mode === "claude" ? "Nothing waiting. You'll get one email when something needs you." : "Nothing waiting. The switch on the dashboard is on Manual, so no new cards come in."}</p></div>`;
  else {
    const c = S.cards[0], info = c.kind === "info";
    h = `<div class="stage">${n > 1 ? '<div class="under"></div>' : ""}${cardHtml(c)}</div>
      <div class="hints"><span>Swipe left: no</span><span>Up: later</span><span>Right: ${c.kind === "reply" ? "send" : "yes"}</span></div>
      <div class="btns">
        <button class="btn b-no" onclick="answer('no')"${info ? " disabled" : ""}>No</button>
        <button class="btn b-later" onclick="answer('later')">Later</button>
        <button class="btn b-yes" onclick="answer('yes')">${info ? "OK" : c.kind === "reply" ? "Send" : "Yes"}</button>
      </div>`;
  }
  $("area").innerHTML = h;
  const done = S.recent.map(r => `<div class="done"><div class="tx"><span class="who${r.status==="auto"?" auto":""}">${r.status==="auto"?"AUTOPILOT DID THIS":r.status==="undone"?"UNDONE":r.status==="failed"?"DIDN'T WORK":r.status==="no"?"YOU SAID NO":"YOU SAID YES"} · ${esc(ago(r.decided))}</span><span class="what">${esc(r.title)}</span>${r.result?`<span class="res">${esc(r.result)}</span>`:""}</div>${r.undo?`<button class="ghost" onclick="undo('${esc(r.id)}')">Undo</button>`:""}</div>`).join("");
  $("recent").innerHTML = (done ? `<div class="sec">Done in the last 7 days</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">${done}</div>` : "") + (scoreHtml() ? `<div style="margin-top:12px">${scoreHtml()}</div>` : "");
  wireSwipe();
}
function answer(a){
  const c = S.cards[0]; if (!c) return;
  if (a === "no"){ if (c.kind === "info") return; openWhy(); return; }
  if (a === "yes" && (c.kind === "ask" || (c.question && c.choices && c.choices.length))){ openDetail(); return; }
  flyOut(a === "yes" ? "right" : a === "later" ? "up" : "left", () => decide(c.id, a));
}

// ---------- swipe ----------
function flyOut(dir, then){
  const el = $("top");
  if (!el){ then(); return; }
  el.classList.add("fly");
  el.style.transform = dir === "right" ? "translate(140%, 0) rotate(18deg)" : dir === "left" ? "translate(-140%, 0) rotate(-18deg)" : "translate(0, -140%)";
  el.style.opacity = "0";
  setTimeout(then, 230);
}
function wireSwipe(){
  const el = $("top"); if (!el) return;
  let sx = 0, sy = 0, dx = 0, dy = 0, down = false, moved = false;
  const stamp = cls => el.querySelector(".stamp." + cls);
  el.addEventListener("pointerdown", e => { if (e.target.closest("button")) return; down = true; moved = false; sx = e.clientX; sy = e.clientY; dx = dy = 0; el.classList.remove("back"); el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", e => {
    if (!down) return; dx = e.clientX - sx; dy = e.clientY - sy;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    el.style.transform = `translate(${dx}px, ${Math.min(dy, 40)}px) rotate(${dx / 18}deg)`;
    stamp("yes").style.opacity = Math.max(0, Math.min(1, dx / 90));
    stamp("no").style.opacity = Math.max(0, Math.min(1, -dx / 90));
    stamp("later").style.opacity = Math.max(0, Math.min(1, -dy / 90 - Math.abs(dx) / 200));
  });
  const end = () => {
    if (!down) return; down = false;
    const c = S.cards[0];
    if (!moved){ el.style.transform = ""; return; }
    if (dx > 90) { el.style.transform = ""; resetStamps(); answer("yes"); return; }
    if (dx < -90) { el.style.transform = ""; resetStamps(); answer("no"); return; }
    if (dy < -90 && Math.abs(dx) < 80) { el.style.transform = ""; resetStamps(); answer("later"); return; }
    el.classList.add("back"); el.style.transform = ""; resetStamps();
  };
  const resetStamps = () => el.querySelectorAll(".stamp").forEach(s => s.style.opacity = "0");
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("click", e => { if (!moved && !e.target.closest("button")) openDetail(); });
  el.addEventListener("keydown", e => { if (e.key === "ArrowRight") answer("yes"); else if (e.key === "ArrowLeft") answer("no"); else if (e.key === "ArrowUp") answer("later"); else if (e.key === "Enter") openDetail(); });
}

// ---------- speech (browser dictation, en-GB) ----------
let REC = null;
function speak(targetId, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ toast("Speech isn't available in this browser. Use the keyboard's mic button instead."); return; }
  if (REC){ REC.stop(); return; }
  const box = $(targetId); REC = new SR(); REC.lang = "en-GB"; REC.interimResults = false; REC.continuous = false;
  btn.classList.add("on");
  REC.onresult = e => { const t = Array.from(e.results).map(r => r[0].transcript).join(" ").trim(); if (t){ box.value = (box.value ? box.value.replace(/\s+$/,"") + " " : "") + t; box.dispatchEvent(new Event("input")); } };
  REC.onend = () => { btn.classList.remove("on"); REC = null; };
  REC.onerror = () => { btn.classList.remove("on"); REC = null; };
  REC.start();
}
const MIC = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>`;

// ---------- detail sheet (tap) ----------
function openDetail(){
  const c = S.cards[0]; if (!c) return;
  const src = c.src && /^https:\/\/mail\.google\.com\//.test(c.src.url || "") ? `<a class="light" href="${esc(c.src.url)}" target="_blank" rel="noopener">Open the email</a>` : "";
  let mid = "";
  if (c.kind === "reply" || c.kind === "ask"){
    mid = `<label class="l" for="bodyEdit">${c.kind === "ask" ? "Write the reply (it goes in the navy look from hello@ to the sender)" : "Tap the words to change them"}</label>
      <textarea class="edit" id="bodyEdit">${esc(c.kind === "reply" ? c.body : "Dear ,\n\n")}</textarea>
      <div class="row2"><button class="light" onclick="speak('bodyEdit', this)">${MIC} Say it</button>${src}</div>`;
  } else if (src) mid = `<div class="row2">${src}</div>`;
  const choices = (c.choices || []).filter(x => x.act !== "write").map((x, i) => `<button class="choice" onclick="pick(${(c.choices||[]).indexOf(x)})">${esc(x.label)}</button>`).join("");
  const q = c.question && c.kind !== "ask" ? `<div style="font-weight:700;color:var(--navy)">${esc(c.question)}</div><div style="display:flex;flex-direction:column;gap:8px">${choices}</div>` : "";
  const isSend = c.kind === "reply" || c.kind === "ask";
  $("detailIn").innerHTML = `<div class="top"><button class="back" onclick="closeSheets()">Back</button><span style="font-size:18px;font-weight:700">${esc(KIND_TAG[c.kind] || "Card")}</span></div>
    <div class="panel">
      <div class="title">${esc(c.title)}</div>
      ${c.place ? `<div class="place">${esc(c.place)}</div>` : ""}
      ${rowsHtml(c.rows)}
      ${c.src && (c.src.subject || c.src.from) ? `<div class="why">Email: ${esc(c.src.subject)}${c.src.from ? " · " + esc(c.src.from) : ""}${c.src.date ? " · " + esc(c.src.date) : ""}</div>` : ""}
      ${c.why ? `<div class="why">${esc(c.why)}</div>` : ""}
      ${q}${mid}
    </div>
    <div class="grid2" style="margin-top:4px">
      <button class="btn b-no" onclick="closeSheets();openWhy()"${c.kind === "info" ? " disabled" : ""}>${isSend ? "Don't send" : "No"}</button>
      <button class="btn b-yes" onclick="detailYes()"${c.question && c.kind !== "ask" ? " hidden" : ""}>${isSend ? "Send" : c.kind === "info" ? "OK" : "Yes"}</button>
    </div>
    <button class="btn b-later" onclick="closeSheets();answer('later')">Later</button>`;
  $("detail").hidden = false; $("main").setAttribute("aria-hidden","true");
  const ta = $("bodyEdit"); if (ta && c.kind === "ask"){ ta.focus(); ta.setSelectionRange(5,5); }
}
async function detailYes(){
  const c = S.cards[0]; if (!c) return;
  const extra = {};
  if (c.kind === "reply" || c.kind === "ask"){ extra.body = $("bodyEdit").value; if (!extra.body.trim() || /^Dear ,\s*$/.test(extra.body.trim())){ toast("Write the reply first."); return; } }
  closeSheets();
  flyOut("right", () => decide(c.id, "yes", extra));
}
function pick(i){ const c = S.cards[0]; if (!c) return; closeSheets(); flyOut("right", () => decide(c.id, "choice", { choice: i })); }

// ---------- why sheet (no) ----------
function openWhy(){
  const c = S.cards[0]; if (!c) return;
  S.why = { chip: "", note: "" };
  $("whyIn").innerHTML = `<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:22px;font-weight:700">Why not?</span><span style="font-size:14px;color:var(--text2);line-height:1.4">One tap is enough. It teaches the booking reader so the same mistake isn't made again.</span></div>
    <div class="msg" style="padding:12px 14px;font-size:14px">${esc(c.title)}${c.place ? " · " + esc(c.place) : ""}</div>
    <div class="chips">${CHIPS.map(x => `<button class="chip" data-chip="${x[0]}" onclick="chip('${x[0]}')">${esc(x[1])}</button>`).join("")}</div>
    <label for="whyNote" style="font-size:14px;color:var(--text2)">Or say what's wrong (optional)</label>
    <div class="whyin"><input id="whyNote" type="text" placeholder="e.g. this agent always sends old tenants" oninput="S.why.note=this.value;lessonPrev()"><button class="mic" aria-label="Say it" onclick="speak('whyNote', this)">${MIC}</button></div>
    <div class="lessonprev" id="lessonPrev"></div>
    <div class="grid2"><button class="btn b-later" onclick="sendNo(true)">Skip</button><button class="btn b-yes" onclick="sendNo(false)">Save</button></div>
    <button class="back" onclick="closeSheets()">Cancel, keep the card</button>`;
  $("whysheet").hidden = false; $("main").setAttribute("aria-hidden","true");
}
function chip(k){ S.why.chip = S.why.chip === k ? "" : k; document.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.chip === S.why.chip)); lessonPrev(); }
function lessonPrev(){ $("lessonPrev").textContent = S.why.chip ? CHIP_LESSON[S.why.chip] : (S.why.note.trim() ? "Lesson: " + S.why.note.trim() : ""); }
function sendNo(skip){
  const c = S.cards[0]; if (!c) return;
  const extra = skip ? {} : { why: S.why.chip, note: S.why.note.trim() };
  closeSheets();
  flyOut("left", () => decide(c.id, "no", extra));
}
function closeSheets(){ if (REC) REC.stop(); $("detail").hidden = true; $("whysheet").hidden = true; $("main").removeAttribute("aria-hidden"); }

load();
setInterval(() => { if (document.visibilityState === "visible" && $("detail").hidden && $("whysheet").hidden && !S.busy) load(true); }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && $("detail").hidden && $("whysheet").hidden) load(true); });
</script>
</body>
</html>
