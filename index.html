<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WPS Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var th=localStorage.getItem("wps_theme_v1");if(th==="light"||th==="night")document.documentElement.setAttribute("data-theme",th);}catch(e){}</script>
<style>
  :root{
    color-scheme: light only;
    --card:#FFFFFF; --brand-text:#1F2D5A;
    --green:#2E6B45; --green-bg:#E0F0E6; --amber:#8A5A00; --amber-bg:#FFF1D0; --red:#B42318; --red-bg:#FDF0EE;
    --paper:#F5F7FB; --paper-deep:#E9EEF6;
    --ink:#1B1D21; --ink-soft:#5C6470;
    --brand:#1F2D5A; --brand-dark:#141D3D;
    --peri:#4A5B8A; --peri-bg:#E7EAF3;
    --coral:#E0684B; --coral-dark:#C8553A; --coral-bg:#FBE7E1;
    --sky:#C9D6E8;
    --line:#DFE3E9; --line-soft:#EEF1F5;
    --stone:#7A8493; --stone-bg:#E9ECF0;
    --white:#FFFFFF;
  }
  html{ color-scheme: light only; background:#F4F7FB; background:var(--paper); width:100%; min-height:100%; }
  * { box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    margin:0; min-height:100vh; width:100%;
    background:#F4F7FB; background:var(--paper);
    color:var(--ink);
    font-family: 'Jost','Helvetica Neue','Segoe UI',Arial,sans-serif;
    color-scheme: light only;
  }
  #app{ background:#F4F7FB; background:var(--paper); min-height:100vh; }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 36px 60px; background:var(--paper); }
  .serif{ font-family:'Cormorant Garamond', Georgia, serif; }
  .mono{ font-family:'IBM Plex Mono','Consolas',monospace; }
  a{ color:inherit; }

  /* header */
  .header-band{ background:var(--brand); padding:20px 0; }
  .header-inner{
    max-width:1040px; margin:0 auto; padding:0 22px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
  }
  .brand-row{ display:flex; align-items:center; gap:14px; }
  .logo-badge{
    width:46px; height:46px; border-radius:11px; background:var(--card);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-name{ display:flex; align-items:baseline; gap:9px; }
  .brand-name .name{ font-size:22px; font-weight:600; color:var(--white); letter-spacing:-0.01em; }
  .brand-name .sub{ font-size:10.5px; font-weight:600; color:var(--sky); letter-spacing:0.14em; }
  .tool-tag{ font-size:12px; font-weight:500; color:var(--sky); margin-top:2px; opacity:.85; }

  .utility-row{ display:flex; justify-content:flex-end; gap:20px; padding:14px 0 4px; }
  .btn-link{ display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--ink-soft); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:4px 2px; }
  .btn-link:hover{ color:var(--brand-text); }

  .btn{ display:inline-flex; align-items:center; gap:7px; border:none; border-radius:7px; padding:10px 16px; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit; }
  .btn-coral{ background:var(--coral); color:var(--white); }
  .btn-coral:hover{ background:var(--coral-dark); }
  .btn-ghost{ background:none; border:1px solid var(--line); color:var(--ink-soft); }
  .btn-ghost:hover{ background:var(--line-soft); }
  .btn-text{ background:none; border:none; color:var(--peri); cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:600; padding:0; }
  .btn-sm{ padding:6px 10px; font-size:12.5px; border-radius:6px; }

  /* Today dashboard */
  .today-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; margin:20px 0; }
  .t-card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .t-card.wide{ grid-column:1/-1; }
  .t-card h3{ margin:0 0 10px; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-weight:600; font-size:21px; color:var(--brand-text); display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .t-card h3 .count{ font-family:'Jost',Arial,sans-serif; font-style:normal; font-size:13px; font-weight:600; color:var(--ink-soft); }
  .t-row{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line-soft); font-size:14px; }
  .t-row:first-of-type{ border-top:none; }
  .t-time{ min-width:52px; font-weight:600; color:var(--brand-text); }
  .t-main{ flex:1; min-width:0; }
  .t-main .sub{ color:var(--ink-soft); font-size:12.5px; margin-top:2px; }
  .t-empty{ color:var(--stone); font-size:13.5px; padding:6px 0; }
  .t-link{ background:none; border:none; padding:0; color:var(--peri); font:inherit; font-weight:600; cursor:pointer; text-align:left; }
  .t-links{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .t-links a{ display:block; padding:10px 12px; border:1px solid var(--line); border-radius:8px; color:var(--brand-text); text-decoration:none; font-weight:600; font-size:13.5px; background:var(--paper); }
  .t-links a:hover{ border-color:var(--peri); }
  .t-big{ font-size:30px; font-weight:600; line-height:1; }
  .perf-quote{ position:relative; overflow:hidden; display:flex; gap:14px; align-items:flex-start; margin:0 0 14px; padding:16px 18px 16px 20px; border-radius:14px;
    background:linear-gradient(135deg, var(--brand) 0%, #2B3D74 100%); color:#fff; animation:pqIn .6s ease-out both; }
  .perf-quote:before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--coral); }
  .perf-quote:after{ content:""; position:absolute; right:-40px; top:-40px; width:140px; height:140px; border-radius:50%; background:rgba(224,104,75,.18); }
  .perf-quote .pq-icon{ flex:0 0 auto; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; font-size:19px; }
  .perf-quote .pq-text{ position:relative; z-index:1; }
  .perf-quote .pq-main{ font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-weight:600; font-size:23px; line-height:1.2; }
  .perf-quote .pq-sub{ margin-top:6px; font-size:13px; color:#D6DEF2; line-height:1.45; }
  @keyframes pqIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .perf-quote{ animation:none; } }
  @media (max-width:640px){ .perf-quote .pq-main{ font-size:20px; } }
  .perf-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:2px 0 8px; }
  .perf-box{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--card, var(--white)); }
  .perf-box .p-lbl{ font-size:12.5px; font-weight:600; color:var(--coral-dark); letter-spacing:.02em; margin-bottom:6px; }
  .perf-box .p-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:5px; line-height:1.4; }
  .p-up{ color:var(--green, #2E6B45); font-weight:600; } .p-down{ color:var(--red, #B42318); font-weight:600; } .p-same{ color:var(--stone); font-weight:600; }
  .wk-strip{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; }
  .wk-day{ background:var(--paper); border:1px solid var(--line-soft); border-radius:8px; padding:8px; min-height:110px; display:flex; flex-direction:column; gap:6px; }
  .wk-day.wk-end{ background:var(--paper-deep); }
  .wk-head{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .wk-head span{ color:var(--brand-text); }
  .wk-job{ text-align:left; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--peri); border-radius:6px; padding:6px 7px; cursor:pointer; font-family:inherit; }
  .wk-t{ font-size:12px; font-weight:600; color:var(--brand-text); }
  .wk-a{ font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wk-c{ font-size:11.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wk-free{ font-size:12px; color:var(--stone); }
  .wk-add{ margin-top:auto; background:none; border:none; color:var(--peri); font:inherit; font-size:12px; text-align:left; cursor:pointer; padding:0; }
  @media (max-width:900px){ .wk-strip{ grid-template-columns:1fr; } .wk-day{ min-height:0; } }


  /* compact dashboard (one screen) */
  .wrap-dash{ max-width:1560px; }
  .wrap-dash .page-head{ padding-top:20px; }
  .d-tiles{ display:grid; grid-template-columns:repeat(11,minmax(0,1fr)); gap:6px 8px; margin:14px 0 12px; }
  .d-tile{ text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:9px; padding:8px 10px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; min-width:0; }
  .d-tile:hover{ border-color:var(--peri); }
  .d-tile.on{ border-color:var(--brand); background:var(--sky); }
  .d-num{ font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; font-size:26px; line-height:1.05; }
  .d-lbl{ font-size:12px; font-weight:600; color:var(--ink); line-height:1.25; }
  .d-sub{ font-size:11px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .d-row{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.6fr); gap:12px; margin-bottom:12px; }
  .d-card{ padding:12px 16px; }
  .d-card h3{ font-size:19px; margin-bottom:6px; }
  .d-route{ text-decoration:none; margin-right:10px; padding:4px 9px; border-radius:6px; background:var(--brand); color:#fff; font-size:12px; font-weight:600; }
  .c-row{ display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line-soft); font-size:13.5px; min-width:0; }
  .c-row:first-of-type{ border-top:none; }
  .c-when{ flex:0 0 auto; min-width:64px; font-weight:600; color:var(--brand-text); white-space:nowrap; }
  .c-job{ flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; font:inherit; color:var(--peri); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c-job b{ font-weight:600; }
  .c-dim{ color:var(--ink-soft); font-weight:400; }
  .d-panel-top{ margin:0 0 14px; border:2px solid var(--brand, #1F2D5A); }
  .d-panel-top h3{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .d-x{ font:inherit; font-size:12.5px; font-weight:600; background:none; border:1px solid var(--line); border-radius:8px; padding:4px 10px; color:var(--ink-soft); cursor:pointer; }
  .d-x:hover{ color:var(--ink); border-color:var(--ink-soft); }
  .d-panel .t-row{ padding:6px 0; font-size:13.5px; }
  .d-more{ font-size:12.5px; margin-top:6px; margin-right:16px; }
  .d-note{ font-size:12px; color:var(--stone); margin-top:6px; }
  .d-wk{ min-height:0; padding:6px; gap:4px; }
  .d-wk .wk-head{ display:flex; align-items:center; gap:4px; }
  .d-add{ margin:0 0 0 auto; font-size:16px; line-height:1; padding:0 2px; }
  .d-wkjob{ padding:4px 6px; }
  .d-wkjob .wk-t{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side-links{ display:flex; flex-direction:column; gap:1px; }
  .side-links .side-label{ font-size:11px; font-weight:600; letter-spacing:.16em; color:#8A97B8; padding:0 14px 6px; }
  .side-links a{ color:var(--sky); font-size:13.5px; text-decoration:none; padding:5px 14px; border-radius:6px; }
  .side-links a:hover{ background:rgba(255,255,255,.06); color:#fff; }
  #undo-bar{ position:fixed; left:50%; bottom:20px; transform:translate(-50%,140%); display:flex; align-items:center; gap:14px; max-width:calc(100vw - 32px); padding:10px 12px 10px 16px; background:var(--brand); color:#fff; border-radius:10px; font-size:14px; box-shadow:0 6px 24px rgba(31,45,90,.28); opacity:0; transition:transform .2s, opacity .2s; z-index:999; pointer-events:none; }
  #undo-bar.show{ transform:translate(-50%,0); opacity:1; pointer-events:auto; }
  #undo-bar button{ border:0; border-radius:6px; background:var(--coral); color:#fff; font:inherit; font-weight:600; padding:6px 12px; cursor:pointer; }
  #undo-bar button.undo-x{ background:transparent; padding:6px 4px; font-weight:400; opacity:.8; }
  @media (max-width:600px){ #undo-bar{ width:calc(100vw - 32px); box-sizing:border-box; justify-content:space-between; bottom:12px; } #undo-bar span{ flex:1; } }
  .ph-box{ border-top:1px solid var(--line); padding-top:10px; }
  .ph-h{ font-weight:600; font-size:13px; margin-bottom:4px; }
  .ph-row{ display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; font-size:13px; padding:3px 0; }
  .ph-d{ min-width:92px; font-variant-numeric:tabular-nums; } .ph-t{ min-width:30px; font-weight:600; }
  .mm-card{ margin-top:14px; padding:12px 14px; border:1px solid var(--line, #e3e6ee); border-radius:10px; font-size:13px; }
  .mm-key{ font-weight:400; margin-left:10px; color:var(--ink-soft); text-transform:none; letter-spacing:0; }
  .mm-dot{ display:inline-block; width:9px; height:9px; border-radius:2px; margin:0 4px 0 8px; vertical-align:-1px; }
  .mm-row{ display:grid; grid-template-columns:38px 1fr 74px; gap:8px; align-items:center; padding:5px 0; }
  .mm-bars{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .mm-bar{ display:block; height:8px; border-radius:3px; }
  .mm-i{ background:var(--brand, #1F2D5A); } .mm-p{ background:var(--green, #2E6B45); }
  .mm-v{ text-align:right; font-variant-numeric:tabular-nums; font-size:12.5px; line-height:1.25; }
  .pr-top{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-bottom:10px; font-size:13px; }
  .pr-top select{ margin-left:6px; padding:5px 8px; }
  .pr-wrap{ overflow-x:auto; }
  .pr-tab{ border-collapse:collapse; font-size:13px; }
  .pr-tab th, .pr-tab td{ padding:4px 5px; text-align:left; white-space:nowrap; }
  .pr-tab thead th{ font-weight:600; color:var(--ink-soft); font-size:12px; }
  .pr-in{ width:64px; padding:6px 7px; font-variant-numeric:tabular-nums; }
  .d-info{ display:flex; flex-direction:column; gap:2px; margin:-2px 0 6px; padding-left:74px; font-size:12.5px; color:var(--ink); line-height:1.4; }
  .d-tel{ color:var(--coral-dark); font-weight:600; text-decoration:none; white-space:nowrap; }
  @media (max-width:600px){ .d-info{ padding-left:0; font-size:13px; } }
  .d-sect{ margin:2px 0 6px; font-size:12.5px; font-weight:600; color:var(--coral-dark); letter-spacing:.02em; }
  .sl-set{ font-size:13px; margin:0 0 10px; }
  .sl-edit{ padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .sl-row{ display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; margin:4px 0; }
  .sl-row input[type=time], .sl-row input[type=number]{ width:auto; flex:0 0 auto; font:inherit; padding:3px 6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  .sl-row input[type=number]{ width:58px; }
  .sl-l{ min-width:62px; font-weight:600; }
  .sl-dl{ white-space:nowrap; }
  .sl-st{ font-size:12px; white-space:nowrap; }
  .sl-picked{ color:var(--coral-dark); font-weight:600; white-space:normal; }
  .hc-row{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:2px 10px; padding:8px 0; border-top:1px solid var(--line-soft); font-size:13px; }
  .hc-row:first-child{ border-top:none; }
  .hc-pill{ grid-row:span 2; align-self:start; font-size:11px; font-weight:700; border-radius:99px; padding:2px 8px; white-space:nowrap; }
  .hc-ok{ background:var(--green-bg); color:var(--green); } .hc-fixed{ background:var(--sky-bg, #E7EEF8); color:var(--brand-text, var(--brand)); }
  .hc-warn{ background:var(--amber-bg); color:var(--amber); } .hc-problem{ background:var(--red-bg); color:var(--red); }
  .hc-todo{ grid-column:2; color:var(--ink-soft); }
  .hc-side{ font:inherit; font-size:12px; padding:0 0 6px; background:none; border:none; cursor:pointer; text-align:left; color:inherit; }
  .d-mv.sl-ok{ background:var(--coral); color:#fff; }
  .d-mv{ white-space:nowrap; border:1px solid var(--coral); background:var(--card); color:var(--coral-dark); border-radius:6px; padding:3px 9px; font-size:12px; font-weight:600; cursor:pointer; }
  .d-mv:hover{ background:var(--coral-bg); }
  .pl-row{ display:flex; gap:6px; align-items:center; }
  .pl-row input{ flex:1; min-width:0; }
  .pl-row .btn{ flex:none; text-decoration:none; }
  .d-acts{ display:inline-flex; gap:6px; flex-wrap:wrap; }
  .rr-box{ margin:4px 0 10px; padding:10px 12px; border:1px solid #E3B5A8; border-radius:8px; background:#FFF8F5; font-size:13px; }
  .rr-box .rr-t{ font-weight:600; color:var(--coral-dark); margin-bottom:6px; }
  .rr-box .rr-f{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin:6px 0; }
  .rr-box label{ display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--stone); }
  .rr-box input[type=date], .rr-box input[type=time]{ font:inherit; padding:5px 7px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  .rr-box .rr-chk{ flex-direction:row; align-items:center; gap:6px; color:var(--ink); font-size:13px; margin:4px 0 8px; }
  .rr-box .rr-b{ display:flex; gap:8px; flex-wrap:wrap; }
  .rr-warn{ color:var(--red); font-size:12px; margin-top:4px; }
  .rr-tag{ white-space:nowrap; font-size:11.5px; color:var(--coral-dark); background:var(--coral-bg); border-radius:5px; padding:2px 7px; }
  .d-ghead{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); padding:0 2px 2px; border-bottom:2px solid var(--line); margin-bottom:-2px; }
  .d-ghead.d-g-todo{ border-color:var(--coral); } .d-ghead.d-g-wait{ border-color:var(--peri); } .d-ghead.d-g-money{ border-color:var(--brand); } .d-ghead.d-g-perf{ border-color:var(--green); }
  .d-tile.zero{ opacity:.55; } .d-tile.zero:hover{ opacity:1; }
  @media (min-width:1251px){ .d-tile.d-gstart{ margin-left:6px; } .d-ghead.d-g-wait, .d-ghead.d-g-money, .d-ghead.d-g-perf{ margin-left:6px; } }
  @media (max-width:1450px){ .d-ghead{ display:none; } .d-tile{ border-top-width:3px; } .d-tile.d-g-todo{ border-top-color:var(--coral); } .d-tile.d-g-wait{ border-top-color:var(--peri); } .d-tile.d-g-money{ border-top-color:var(--brand); } .d-tile.d-g-perf{ border-top-color:var(--green); } }
  @media (max-width:1450px){ .d-tiles{ grid-template-columns:repeat(6,minmax(0,1fr)); } }   /* 11 tiles since the Mid-terms tile (19 Oct) */
  @media (max-width:900px){ .d-row{ grid-template-columns:1fr; } .d-tiles{ grid-template-columns:repeat(2,minmax(0,1fr)); } .c-row{ flex-wrap:wrap; } .c-job{ white-space:normal; } }

  /* status strip */
  .status-strip{ display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr)); gap:8px; margin:20px 0; }
  .due{ display:block; margin-top:4px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .due-ok{ color:var(--ink-soft); } .due-soon{ color:var(--amber); } .due-late{ color:var(--red); }
  tr.row-late td{ background:var(--red-bg); }
  .status-card{ text-align:left; border:1.5px solid var(--line); background:var(--card); border-radius:9px; padding:12px 14px; cursor:pointer; font-family:inherit; }
  .status-card .num{ font-size:24px; font-weight:700; font-family:'Cormorant Garamond',Georgia,serif; }
  .status-card .lbl{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }

  /* toolbar */
  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .search-wrap{ position:relative; flex:1 1 220px; }
  .search-wrap svg{ position:absolute; left:10px; top:11px; }
  input[type=text], input[type=date], input[type=time], input[type=email], input[type=tel], select:where(:not(.sel-box)), textarea{
    font-family:inherit; font-size:14.5px; color:var(--ink) !important; background:var(--card) !important;
    border:1px solid var(--line); border-radius:6px; padding:8px 10px; outline:none; width:100%;

  /* ---------- themes (Lex, 18 Oct): Classic (default), Light, Night. Picked in the left menu, remembered per device. ---------- */

function invoiceMeta(c){ return INVOICE_STATES.find(s=>s.code===(c||"")) || INVOICE_STATES[0]; }
function needsInvoice(j){ return REPORT_OUT.includes(j.status) && !j.invoice; }
const DUE_STATUSES = ["booked","processing","completed"];   // report not yet sent
// Finished jobs (13 Oct): paid, and the report is finished. Check-outs etc. at Sent or later; inventory &
// check-ins at Signed, Deemed agreed or Archived. Hidden from the Job Log's main list, shown under "Finished".
// Reports completed counter (Lex, 14 Oct; built 18 Oct). Every job type counts once its report is done:
// inventory & check-ins at Signed, Deemed agreed or Archived; everything else at Sent or later.
// Month/year come from the signed, deemed or sent date (else the visit date).
// WPS jobs only, counting from zero. A second small line adds Wellington Parker's total (WP_TOTAL) for a combined figure
// (Lex, 18 Oct evening, option 7A); the WPS counts and milestones stay WPS only.
function reportDoneAt(j){
  const done = j.type==="ICI" ? ["signed","deemed","archived"].includes(j.status) : REPORT_OUT.includes(j.status);
  if (!done) return null;
  const s = (j.type==="ICI" ? (j.signedAt || j.deemedAt) : "") || j.sentAt || (j.date ? j.date+"T12:00:00" : "");
  const d = s ? new Date(s) : null;
  return d && !isNaN(d) ? d : new Date(0);
}
function doneCounts(){
  const now = new Date(); let all = 0, year = 0, month = 0;
  state.jobs.forEach(j => {
    const d = reportDoneAt(j); if (!d) return;
    all++;
    if (d.getFullYear()===now.getFullYear()){ year++; if (d.getMonth()===now.getMonth()) month++; }
  });
  return { all, year, month };
}
// Milestones (Lex, 18 Oct): a one-off message under the dashboard panel when WPS passes each figure, and a special one
// the day WPS beats Wellington Parker's total. Shown once per device until "Thanks" is pressed.
const WP_TOTAL = 3507;   // Wellington Parker reports, 2014 to Sep 2026 (17 Oct Dropbox index). Milestone target, and added to the combined line.
const MILESTONES = [50, 100, 250, 500, 1000, 2000, 3000];
const LS_MILESTONES = "wps_milestones_seen_v1";
function milestoneMessage(m, n){
  if (m === "wp") return ["You've beaten Wellington Parker!", `${n.toLocaleString("en-GB")} reports under Wellington Property Services. That's more than all ${WP_TOTAL.toLocaleString("en-GB")} Wellington Parker reports. A new record, built by you.`];
  const lines = {
    50:   "50 reports done under WPS. A proper start.",
    100:  "100 reports. Three figures under the new name.",
    250:  "250 reports. A quarter of a thousand.",
    500:  "500 reports. Half a thousand properties covered.",
    1000: "1,000 reports. Four figures. WPS is well and truly established.",
    2000: "2,000 reports. Double the thousand.",
    3000: `3,000 reports. ${(WP_TOTAL - n > 0 ? (WP_TOTAL - n).toLocaleString("en-GB") + " to go" : "Nearly there")} to pass Wellington Parker.`
  };
  return ["Milestone: " + m.toLocaleString("en-GB") + " reports", lines[m]];
}
function seenMilestones(){ try { return JSON.parse(lsGet(LS_MILESTONES) || "[]"); } catch(e){ return []; } }
function currentMilestone(){
  const n = doneCounts().all, seen = seenMilestones();
  if (n > WP_TOTAL && !seen.includes("wp")) return { m: "wp", n };
  const hit = MILESTONES.filter(m => n >= m && !seen.includes(m));
  return hit.length ? { m: hit[hit.length-1], n } : null;
}
function dismissMilestone(){
  const n = doneCounts().all, seen = seenMilestones();
  MILESTONES.forEach(m => { if (n >= m && !seen.includes(m)) seen.push(m); });   // the ones passed on the way count as seen
  if (n > WP_TOTAL && !seen.includes("wp")) seen.push("wp");
  lsSet(LS_MILESTONES, JSON.stringify(seen)); render();
}
function renderMilestone(){
  const c = currentMilestone(); if (!c) return "";
  const [h, msg] = milestoneMessage(c.m, c.n);
  return `<div class="t-card d-card milestone${c.m === "wp" ? " ms-wp" : ""}"><div class="ms-star">${c.m === "wp" ? "🏆" : "★"}</div><div class="ms-body"><h3>${esc(h)}</h3><p>${esc(msg)}</p></div><button class="btn btn-coral btn-sm" onclick="dismissMilestone()">Thanks</button></div>`;
}

}

  calYear: TODAY.getFullYear(),

// ---------------------------------------------------------------- storage
function normalizeClients(arr){
  if (!Array.isArray(arr)) return null;
  const out = arr.map(x => typeof x === "string"
    ? { name:x, contactName:"", contactPhone:"", contactEmail:"" }
    : Object.assign({ name:x.name||"", contactName:x.contactName||"", contactPhone:x.contactPhone||"", contactEmail:x.contactEmail||"" },
        x.prices && typeof x.prices === "object" ? { prices: x.prices } : {},
        x.checkinWay === "ask" || x.checkinWay === "agent" ? { checkinWay: x.checkinWay } : {},
        x.checkinLead !== undefined && x.checkinLead !== "" && !isNaN(Number(x.checkinLead)) ? { checkinLead: Number(x.checkinLead) } : {})
  ).filter(c=>c.name);
  return out.length ? out : null;
}
function load(){
  try { const j = localStorage.getItem(LS_JOBS); if (j) state.jobs = cleanJobs(JSON.parse(j)); } catch(e){}
  state.jobs.forEach(j=>{ if (j.status==="report_sent") j.status = "sent"; });

    const c = localStorage.getItem(LS_CLIENTS);
    if (c){ const norm = normalizeClients(JSON.parse(c)); if (norm) state.clients = norm; }
  } catch(e){}
  try { const k = normalizeContacts(JSON.parse(localStorage.getItem(LS_CONTACTS)||"null")); state.contacts = k || SEED_CONTACTS.map(c=>Object.assign({},c)); } catch(e){ state.contacts = SEED_CONTACTS.map(c=>Object.assign({},c)); }
  if (fillContactsFromData()) lsSet(LS_CONTACTS, JSON.stringify(state.contacts));
  try { state.gcalConnected = localStorage.getItem(LS_GCAL_PREF) === "1"; } catch(e){}
  try { state.helpOn = localStorage.getItem(LS_HELP) !== "0"; } catch(e){}

  try { const q = localStorage.getItem(LS_QUEUE_DONE); if (q) state.queueDone = JSON.parse(q) || {}; } catch(e){}
}
function getJobNoHigh(){ try { return JSON.parse(localStorage.getItem(LS_JOBNO_HIGH)||"{}")||{}; } catch(e){ return {}; } }
function mergeJobNoHigh(extra){
  const high = getJobNoHigh();
  const add = (prefix, n) => { if (!isNaN(n) && (!high[prefix] || n > high[prefix])) high[prefix] = n; };
  state.jobs.forEach(j => { const m = /^(WPS\d{4})(\d+)$/.exec(j.jobNo||""); if (m) add(m[1], parseInt(m[2],10)); });
  if (extra) Object.keys(extra).forEach(k => add(k, parseInt(extra[k],10)));
  try { localStorage.setItem(LS_JOBNO_HIGH, JSON.stringify(high)); } catch(e){}
  return high;
}
function saveJobs(){ mergeJobNoHigh(); stampChanged(); localStorage.setItem(LS_JOBS, JSON.stringify(state.jobs)); markLocalChange(); }
// Each job remembers if it was changed on this device since the last sync, so loading another device's copy merges
// job by job instead of throwing this device's changes away (19 Oct: the Cornell re-issue date was lost that way).
const jobSnap = new Map();
function snapKey(j){ const c = Object.assign({}, j); delete c.updatedAt; return JSON.stringify(c); }
function snapAll(){ jobSnap.clear(); state.jobs.forEach(j => jobSnap.set(j.id, snapKey(j))); }
function dirtyGet(){ try { const d = JSON.parse(lsGet(LS_DIRTY) || "{}"); return { any: !!d.any, seq: d.seq || 0, ids: d.ids || {}, gone: d.gone || {}, slot: !!d.slot }; } catch(e){ return { any:false, seq:0, ids:{}, gone:{}, slot:false }; } }
function dirtySet(d){ lsSet(LS_DIRTY, JSON.stringify(d)); }
function dirtyAny(){ const d = dirtyGet(); return d.any || Object.keys(d.ids).length > 0 || Object.keys(d.gone).length > 0; }
function stampChanged(){
  const now = new Date().toISOString(), d = dirtyGet(), ids = new Set(state.jobs.map(j => j.id));
  state.jobs.forEach(j => { const k = snapKey(j); if (jobSnap.get(j.id) !== k){ j.updatedAt = now; jobSnap.set(j.id, k); d.ids[j.id] = ++d.seq; delete d.gone[j.id]; } });
  [...jobSnap.keys()].forEach(id => { if (!ids.has(id)){ jobSnap.delete(id); d.gone[id] = now; delete d.ids[id]; } });
  dirtySet(d);
}
// After a save reached the Sheet: forget the changes that were in it (not ones made while it was saving).
function dirtyClearSent(sent){
  const d = dirtyGet();
  Object.keys(sent.ids).forEach(id => { if (d.ids[id] === sent.ids[id]) delete d.ids[id]; });
  Object.keys(sent.gone).forEach(id => { if (d.gone[id] === sent.gone[id]) delete d.gone[id]; });
  if (d.seq === sent.seq){ d.any = false; d.slot = false; }
  dirtySet(d);
}
function mergeJobLists(local, cloud, dirty){
  const L = new Map(local.map(j => [j.id, j])), C = new Map(cloud.map(j => [j.id, j]));
  const at = j => Date.parse(j && j.updatedAt || "") || 0, out = [];
  cloud.forEach(c => {
    const l = L.get(c.id);
    if (l) out.push(dirty.ids[c.id] && at(c) <= at(l) ? l : c);   // changed here: keep ours unless theirs is newer
    else if (!dirty.gone[c.id] || at(c) > Date.parse(dirty.gone[c.id])) out.push(c);   // deleted here: stays deleted
  });
  local.forEach(l => { if (!C.has(l.id) && dirty.ids[l.id]) out.push(l); });   // added here; otherwise deleted elsewhere
  return out;
}
// D8 (Lex, 20 Oct): two devices can each make a new job before syncing and both pick the same next number.
// The Sheet only takes one save at a time, so whichever device saves second merges first: here. Any job made on
// this device (not in the Sheet yet) whose number the Sheet already has is moved to the next free number for its
// month. The job already in the Sheet keeps its number, so the other device never changes. Numbers typed by hand
// in another format are left alone (the duplicate flag in Do next still shows them).
function fixJobNoClashes(cloudJobs){
  const cloudIds = new Set((cloudJobs||[]).map(j => j && j.id));
  const taken = new Set((cloudJobs||[]).map(j => normJobNo(j && j.jobNo)).filter(Boolean));
  const moved = [];
  state.jobs.forEach(j => {
    if (!j || cloudIds.has(j.id) || !j.jobNo) return;
    const n = normJobNo(j.jobNo);
    if (!taken.has(n)){ taken.add(n); return; }
    if (!/^WPS\d{4}\d+$/.test(n)) return;
    const old = j.jobNo;
    let nn = nextJobNumber(j.date), guard = 0;
    while (taken.has(normJobNo(nn)) && guard++ < 200){ const m = /^(WPS\d{4})(\d+)$/.exec(nn); nn = m[1] + pad2(parseInt(m[2],10) + 1); }
    j.jobNo = nn; taken.add(normJobNo(nn));
    mergeJobNoHigh();
    logChange(j, "Job number changed from "+old+" to "+nn+" ("+old+" was already used on another device)");
    moved.push({ job:j, old });
  });
  if (moved.length){
    state.jobNoMoved = (state.jobNoMoved||[]).concat(moved.map(m => m.old+" → "+m.job.jobNo));
    setTimeout(() => {
      moved.forEach(m => { if (m.job.gcalEventId) try { syncJobToCalendar(m.job); } catch(e){} });
      showActionBar("Job number clash with another device: "+moved.map(m => m.old+" is now "+m.job.jobNo+(m.job.address ? " ("+m.job.address+")" : "")).join("; ")+".");
    }, 0);
  }
  return moved;
}
function mergeByName(local, cloud, key){
  const seen = new Set(cloud.map(x => String(x[key]||"").toLowerCase()));
  return cloud.concat(local.filter(x => !seen.has(String(x[key]||"").toLowerCase())));
}

// ---------------------------------------------------------------- Google Sheet master copy

const SHEET_JOB_COLS = [

  ["Address","address"],["Town","town"],["Postcode","postcode"],["Client","client"],
  ["Tenants","tenants"],["Tenant emails","tenantEmails"],["Tenant phones","tenantPhones"],["Agent email","agentEmail"],["Invoice","invoice"],["Invoice no","invoiceNo"],
  ["Photo link","photoLink"],["Notes","notes"],["ID","id"]
];
let cloudSaveTimer = null;
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function markLocalChange(){
  lsSet(LS_LOCAL_SAVED_AT, new Date().toISOString());
  const dd = dirtyGet(); dd.any = true; dd.seq++; dirtySet(dd);
  if (keyMode()){ scheduleCloudSave(); return; }   // device key: no sign-in needed, save straight away
  if (!state.gcalConnected) return;
  // Ask for the Google token now, while we're still inside the click (pop-ups need a click).
  if (!(state.gcalToken && state.sheetsOk && Date.now() < state.gcalTokenExpiry - 60000)){
    ensureSheetsToken(function(){ scheduleCloudSave(); });
    return;
  }
  scheduleCloudSave();
}
function scheduleCloudSave(){
  clearTimeout(cloudSaveTimer);
  setCloud("saving");
  cloudSaveTimer = setTimeout(cloudSave, 1500);
}
function setCloud(status, msg){
  state.cloudStatus = status; state.cloudMsg = msg || "";
  if ((status==="error"||status==="conflict") && state.urlAction && state.urlAction.stage==="working") urlActionFail("Not saved: "+(msg||status)+". Nothing changed in Google.");
  if (status==="saved") state.cloudAt = new Date();
  if (state.planDay && !state.planReal && typeof roadSignedIn === "function" && roadSignedIn()) setTimeout(drawPlan, 0);   // signed in while Plan my day is open: get the road times
  const el = document.getElementById("cloudPill");
  if (el) el.outerHTML = renderCloudPill();
  const sm = document.getElementById("syncMsg");
  if (sm) sm.remove();
  const sb = document.getElementById("syncBtn");
  if (sb) sb.outerHTML = renderSyncBtn();
}
function sheetsGranted(resp){
  try { return google.accounts.oauth2.hasGrantedAllScopes(resp, SHEETS_SCOPE, AMEND_SCOPE); } catch(e){ return false; }
}
function ensureSheetsToken(onReady){
  if (keyMode()){ onReady(); return; }
  if (state.gcalToken && state.sheetsOk && Date.now() < state.gcalTokenExpiry - 60000){ onReady(); return; }
  if (!gcalTokenClient){ initGCal(); }
  if (!gcalTokenClient){ setCloud("error","Google sign-in hasn't loaded"); return; }
  gcalTokenClient.callback = function(resp){

    state.gcalToken = resp.access_token;

async function gapi(url, opts){
  if (keyMode()){
    const m = /\/spreadsheets\/([^/?]+)\/values\/([^?]+)/.exec(url);
    if (!m || m[1] !== AMEND_SHEET_ID) throw new Error("Not available with a device key");
    const tab = decodeURIComponent(m[2]).split("!")[0].replace(/^'(.*)'$/, "$1");
    const d = await dashCall("amendRead", { tab, unformatted: /UNFORMATTED_VALUE/.test(url) });
    if (!d.ok) throw new Error(d.error || "no answer");
    return { values: d.values || [] };
  }
  opts = opts || {};
  const res = await fetch(url, Object.assign({}, opts, {
    headers: Object.assign({ "Authorization": "Bearer "+state.gcalToken, "Content-Type": "application/json" }, opts.headers||{})
  }));
  if (!res.ok){ const t = await res.text(); throw new Error(res.status+" "+t.slice(0,200)); }
  return res.status===204 ? null : res.json();
}
async function findOrCreateSheet(){
  let id = lsGet(LS_SHEET_ID);

    try { await gapi("https://sheets.googleapis.com/v4/spreadsheets/"+id+"?fields=spreadsheetId"); return id; }
    catch(e){ id = null; }
  }
  const q = encodeURIComponent("name='"+SHEET_NAME+"' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
  const found = await gapi("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id,createdTime)&orderBy=createdTime");
  if (found.files && found.files.length){ id = found.files[0].id; lsSet(LS_SHEET_ID,id); return id; }
  const made = await gapi("https://sheets.googleapis.com/v4/spreadsheets", { method:"POST", body: JSON.stringify({
    properties: { title: SHEET_NAME },
    sheets: [ {properties:{title:"Jobs", gridProperties:{frozenRowCount:1}}},
              {properties:{title:"Clients", gridProperties:{frozenRowCount:1}}},
              {properties:{title:"Meta"}} ]

  lsSet(LS_SHEET_ID, made.spreadsheetId);

async function ensureContactsTab(id){

async function cloudSave(){
  if (keyMode()) return dashSave();
  if (!state.gcalToken){ setCloud("error","Google sign-in needed"); return; }
  try {
    const id = await findOrCreateSheet();
    const meta = await readCloudMeta(id);
    const synced = lsGet(LS_CLOUD_SYNCED_AT) || "";
    if (meta.savedAt && (!synced || meta.savedAt > synced)){
      // !synced = this device has never loaded the Sheet (e.g. a new phone): never overwrite it blind
      setCloud("conflict", synced ? "Changed on another device — click Save & get latest" : "Tap Save & get latest to load your jobs from Google");
      return;
    }
    const savedAt = new Date().toISOString();
    const sentDirty = dirtyGet();
    const base = "https://sheets.googleapis.com/v4/spreadsheets/"+id+"/values";
    await ensureContactsTab(id);
    try { mergeQueueDone(meta.queueDone ? JSON.parse(meta.queueDone) : null); } catch(e){}
    // 13 Oct hardening: one write, no clear first. Blank rows overwrite any old rows below the new data,
    // so a dropped connection can never leave the Sheet empty (the old way cleared it, then wrote it).
    const prev = await gapi(base+":batchGet?ranges=Jobs!A:A&ranges=Clients!A:A&ranges=Contacts!A:A&ranges=Meta!A:A");
    const prevLen = i => ((prev.valueRanges[i] && prev.valueRanges[i].values) || []).length;
    const pad = (rows, oldLen) => { const w = rows[0].length, out = rows.slice(); while (out.length < oldLen) out.push(new Array(w).fill("")); return out; };
    const metaRows = [["savedAt", savedAt],["jobs", String(state.jobs.length)],["device", navigator.platform||""],["note","Written by the WPS Job Log. Edit jobs in the Job Log, not here."],["jobNoHigh", JSON.stringify(mergeJobNoHigh())],["queueDone", JSON.stringify(queueDoneForSheet())],["slotSettings", lsGet(LS_SLOT_SET) || meta.slotSettings || ""]];
    await gapi(base+":batchUpdate", { method:"POST", body: JSON.stringify({
      valueInputOption: "RAW",
      data: [
        { range:"Jobs!A1", values: pad(jobsToRows(), prevLen(0)) },
        { range:"Clients!A1", values: pad(clientsToRows(), prevLen(1)) },
        { range:"Contacts!A1", values: pad(contactsToRows(), prevLen(2)) },
        { range:"Meta!A1", values: pad(metaRows, prevLen(3)) }
      ]
    })});
    lsSet(LS_CLOUD_SYNCED_AT, savedAt);
    dirtyClearSent(sentDirty);
    setCloud("saved");
  } catch(e){
    console.log("[WPS] cloud save failed", e);
    setCloud("error","Not saved to Google — will retry on next change");
  }
}
async function cloudLoad(id, meta, merge){
  // Replace this browser's copy with the Sheet's (used by Sync now and by link actions). Returns false if cancelled.
  const hasContacts = await ensureContactsTab(id);
  const r = await gapi("https://sheets.googleapis.com/v4/spreadsheets/"+id+"/values:batchGet?ranges=Jobs&ranges=Clients&ranges=Contacts");
  const parse = (vr) => {
    const rows = (vr && vr.values) || [];
    if (rows.length < 2) return [];
    const di = rows[0].indexOf("Data (do not edit)");
    return rows.slice(1).map(row => { try { return JSON.parse(row[di]); } catch(e){ return null; } }).filter(Boolean);
  };
  return applyCloudCopy(meta, parse(r.valueRanges[0]), parse(r.valueRanges[1]), hasContacts ? parse(r.valueRanges[2]) : null, merge);
}
// Puts the Sheet's copy into this browser. merge = keep this device's unsaved changes (job by job).
function applyCloudCopy(meta, jobs, clientsRaw, contactsRaw, merge){
  let clients = normalizeClients(clientsRaw);
  if (!merge && !jobs.length && state.jobs.length && !confirm("The Google copy has no jobs but this browser has "+state.jobs.length+". Load the empty Google copy anyway?")){ setCloud("error","Sync cancelled"); return false; }
  const dirty = dirtyGet();
  state.jobs = cleanJobs(merge ? mergeJobLists(state.jobs, cleanJobs(jobs), dirty) : jobs);
  if (clients) state.clients = merge ? mergeByName(state.clients, clients, "name") : clients;
  let contacts = contactsRaw ? normalizeContacts(contactsRaw) : null;
  if (contacts && merge) contacts = mergeByName(state.contacts, contacts, "email");
  if (contacts && contacts.length) state.contacts = contacts;   // a Sheet without a Contacts tab keeps this browser's list
  fillContactsFromData();
  lsSet(LS_CONTACTS, JSON.stringify(state.contacts));
  try { mergeJobNoHigh(meta.jobNoHigh ? JSON.parse(meta.jobNoHigh) : null); } catch(e){ mergeJobNoHigh(); }
  if (merge) fixJobNoClashes(jobs);   // D8, 20 Oct: a job made here with a number another device already saved gets the next free number
  try { mergeQueueDone(meta.queueDone ? JSON.parse(meta.queueDone) : null); } catch(e){}
  if (meta.slotSettings && !(merge && dirty.slot)) lsSet(LS_SLOT_SET, meta.slotSettings);   // slot picker settings saved from another device
  localStorage.setItem(LS_JOBS, JSON.stringify(state.jobs));
  localStorage.setItem(LS_CLIENTS, JSON.stringify(state.clients));
  lsSet(LS_CLOUD_SYNCED_AT, meta.savedAt);
  if (!merge){ lsSet(LS_LOCAL_SAVED_AT, meta.savedAt); dirtySet({ any:false, seq: dirty.seq, ids:{}, gone:{}, slot:false }); }
  snapAll();
  return true;
}
async function cloudSyncNow(){

  if (keyMode()){ dashSync(false); return; }
  setCloud("saving");   // show "Saving…" straight away, while Google signs in
  ensureSheetsToken(async function(){
    setCloud("saving");
    try {
      const id = await findOrCreateSheet();
      const meta = await readCloudMeta(id);
      const localAt = lsGet(LS_LOCAL_SAVED_AT) || "";
      const synced = lsGet(LS_CLOUD_SYNCED_AT) || "";
      const cloudNewer = meta.savedAt && meta.savedAt > synced;
      const localChanged = (dirtyAny() || (localAt && localAt > synced)) && state.jobs.length > 0;
      if (cloudNewer && localChanged){
        // 19 Oct: changed here and on another device. Merge job by job (each side keeps its own changes), then save.
        if (!(await cloudLoad(id, meta, true))) return;
        await cloudSave();
        rememberGoogleConnected();
        render();
        return;

      if (cloudNewer){
        if (!(await cloudLoad(id, meta))) return;
        rememberGoogleConnected();
        setCloud("saved");
        render();
      } else {
        await cloudSave();
        rememberGoogleConnected();
        render();
      }

      console.log("[WPS] sync failed", e);
      setCloud("error","Sync failed — check connection");
    }
  });
}

// ---------------------------------------------------------------- helpers
function pad2(n){ return String(n).padStart(2,"0"); }
function uid(){ return 'job_' + Date.now() + '_' + Math.random().toString(36).slice(2,9); }
// Security pass 19 Oct: job ids go into buttons on the page, so every job list loaded from the browser, the Google
// Sheet, a backup file or another tab is checked: ids must be plain (letters, numbers, _ . : -), anything else gets a
// new id; non-text dates and times become blank so the page can't break. Real ids are made by uid() and always pass.
const JOB_ID_OK = /^[A-Za-z0-9_.:-]{1,80}$/;
function cleanJobs(list){
  if (!Array.isArray(list)) return [];
  const seen = new Set();
  return list.filter(j => j && typeof j === "object").map(j => {
    if (typeof j.id !== "string" || !JOB_ID_OK.test(j.id) || seen.has(j.id)) j.id = uid();
    seen.add(j.id);
    if (typeof j.date !== "string") j.date = "";
    if (typeof j.time !== "string") j.time = "";
    return j;
  });
}
function qDate(v){ return typeof v === "string" && /^\d{4}-\d\d-\d\d$/.test(v) ? v : ""; }
function qTime(v){ return typeof v === "string" && /^\d\d:\d\d$/.test(v) ? v : ""; }

function nextJobNumber(dateStr){
  const d = dateStr ? new Date(dateStr) : new Date();
  const yy = pad2(d.getFullYear() % 100);
  const mm = pad2(d.getMonth()+1);
  const prefix = 'WPS' + yy + mm;
  const nums = state.jobs.map(j=>j.jobNo).filter(n=>n && n.startsWith(prefix))
    .map(n=>parseInt(n.slice(prefix.length),10)).filter(n=>!isNaN(n));
  const used = mergeJobNoHigh()[prefix] || 0;
  const next = Math.max(used, nums.length ? Math.max(...nums) : 0) + 1;
  return prefix + pad2(next);
}
function emptyJob(){

           bedrooms:"", extraAreas:"", propertyType:"",

function formatDate(s){
  if (!s) return "—";

  if (isNaN(d)) return s;
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});

function monthKey(s){ return s ? s.slice(0,7) : "undated"; }
function monthLabel(key){

function statusMeta(c){ return STATUSES.find(s=>s.code===c) || STATUSES[0]; }
// ---- report due / turnaround
function visitTime(j){
  if (!j.date) return null;
  const t = new Date(j.date+"T"+(j.time||"17:00")+":00");
  return isNaN(t) ? null : t;
}
function reportDue(j){
  if (!DUE_STATUSES.includes(j.status)) return null;
  const v = visitTime(j);
  const start = j.processingAt ? new Date(j.processingAt) : v;
  if (!start) return null;
  if (j.status==="booked" && (!v || v > new Date())) return null;   // visit hasn't happened yet
  const hrs = TURNAROUND_HOURS[j.type] || 48;
  return new Date(start.getTime() + hrs*3600000);
}
function dueInfo(j){
  const d = reportDue(j); if (!d) return null;
  const mins = Math.round((d - new Date())/60000);
  const fmt = m => { const a=Math.abs(m); return a>=1440 ? Math.round(a/1440)+"d" : a>=60 ? Math.round(a/60)+"h" : a+"m"; };
  // Still at Booked after the visit time: not counted as overdue until the visit is confirmed (12 Oct)
  if (j.status === "booked") return { cls:"due-soon", late:false, confirm:true, text:"Visit done? Move to Processing", due:d };
  // Ageing (Lex, 20 Oct, D4): days since the visit, so old ones stand out
  const v = visitTime(j), ago = v ? Math.floor((Date.now() - v.getTime())/86400000) : 0;
  const agoTxt = ago >= 2 ? " · visited "+ago+" days ago" : "";
  if (mins < 0) return { cls:"due-late", late:true, text:"Report overdue "+fmt(mins)+agoTxt, due:d, ago };
  if (mins < 360) return { cls:"due-soon", late:false, text:"Report due in "+fmt(mins)+agoTxt, due:d, ago };
  return { cls:"due-ok", late:false, text:"Report due "+d.toLocaleString("en-GB",{weekday:"short",hour:"2-digit",minute:"2-digit"})+agoTxt, due:d, ago };
}
// Change history (Lex, 20 Oct, D8): a short dated line per change, newest first, kept on the job (last 40),

function logChange(j, text){

const HIST_FIELDS = [["date","Date"],["time","Time"],["address","Address"],["postcode","Postcode"],["client","Agent"],["type","Type"],["tenants","Tenants"],["tenantEmails","Tenant emails"],["agentEmail","Copy to"],["invoice","Invoice"],["invoiceNo","Invoice no."],["photoLink","Photo link"],["keysFrom","Keys from"],["keysBack","Keys back to"],["parkingExtra","Parking extra"],["notes","Notes"]];

  return st.concat(HIST_FIELDS.filter(([k]) => String(a[k]||"") !== String(b[k]||"")).map(([k,l]) => k === "notes" ? "Notes changed" : l+": "+(String(a[k]||"")||"–")+" → "+(String(b[k]||"")||"–"))).join("; ");

function setJobStatus(j, code){

  j.status = code;
  if (code==="processing" && !j.processingAt) j.processingAt = new Date().toISOString();
  if (code==="booked") delete j.processingAt;
  // report sent date: starts the 7-day comment window and the turnaround score
  if (REPORT_OUT.includes(code) && !j.sentAt) j.sentAt = new Date().toISOString();

// ---------------------------------------------------------------- 7-day comment window (inventory & check-in)
// Window starts when the report is sent; a re-issue after amendments restarts it (changed items only).
// After 7 days with no open amendments the job moves to "Deemed agreed" by itself.
const COMMENT_DAYS = 7, REMINDER_DAYS_LEFT = 2;
function windowStart(j){ const s = j.reissuedAt || j.sentAt; return s ? new Date(s) : null; }
function windowClose(j){ const s = windowStart(j); return s ? addDays(s, COMMENT_DAYS) : null; }
function normJobNo(s){ return String(s||"").toUpperCase().replace(/\s+/g,""); }
function amendOpenFor(j){
  const a = state.amend; if (!a || !a.loaded) return null;          // unknown until the Amendments Sheet is read
  return a.jobs.some(g => normJobNo(g.job) === normJobNo(j.jobNo));
}
function autoReminder(j){
  // date text if the script already sent this window's 7-day reminder, else null
  const a = state.amend; if (!a || !a.autoRem) return null;
  const s = j.reissuedAt || j.sentAt; if (!s) return null;
  return a.autoRem[normJobNo(j.jobNo)+"|"+String(s).slice(0,10)] || null;
}
// 7-day reminders are automatic (Lex, 18 Oct): process email D (WPS Amendments script, live 11 Oct) and the WPS signing
// page both send them by themselves, 2 days before the window closes. Check-ins sent from 11 Oct never get a Write email
// button in Do next or the tiles. Only the comment windows panel keeps a small fallback link, once the reminder day has
// passed with nothing in the script's log (the log is only read when Amendments are loaded).
const AUTO_REMIND_FROM = new Date("2026-10-11T00:00:00");
function am_loaded(){ return !!(state.amend && state.amend.loaded); }
function autoRemindExpected(j){ const s = windowStart(j); return !!(s && s >= AUTO_REMIND_FROM); }
function autoRemindDay(j){
  // the script runs daily at 9am and sends on the first run with 2 days or less left (Lexington and Bow Road: 18 Oct)
  const c = windowClose(j); if (!c) return null;
  const from = addDays(c, -REMINDER_DAYS_LEFT), d = new Date(from); d.setHours(9,0,0,0);
  if (d < from) d.setDate(d.getDate()+1);

}
function needsManualReminder(j, now){

  if (j.status!=="sent" || j.reminderAt || autoReminder(j) || autoRemindExpected(j)) return false;
  const c = windowClose(j); return !!(c && c > now && Math.ceil((c-now)/86400000) <= REMINDER_DAYS_LEFT);
}
function windowState(j){
  // open | hold (amendments open, window passed) | due (passed, amendments not checked yet) | deemed | signed
  if (j.status==="signed") return "signed";
  if (j.status==="deemed") return "deemed";
  const c = windowClose(j); if (!c) return null;
  if (c > new Date()) return "open";
  const open = amendOpenFor(j);
  if (open === true) return "hold";

}
const AMEND_FRESH_MS = 30*60*1000;   // 13 Oct hardening: only deem agreed from an amendments list read in the last 30 minutes
function amendFresh(){ return !!(state.amend && state.amend.loaded && state.amend.at && (Date.now() - new Date(state.amend.at).getTime()) < AMEND_FRESH_MS); }
function autoDeem(){
  // Only runs once the Amendments Sheet has been read recently, so a job with new comments is never deemed agreed.
  if (!amendFresh()) return 0;
  let n = 0;
  state.jobs.forEach(j => {
    if (j.type!=="ICI" || j.status!=="sent") return;
    const c = windowClose(j); if (!c || c > new Date()) return;
    if (amendOpenFor(j)) return;
    j.status = "deemed"; j.deemedAt = c.toISOString(); n++;
  });

  return n;
}
function reissueJob(id){

function cleanEmails(v){
  // tidy a typed/pasted list: split on commas, semicolons or spaces, keep what looks like an email
  return String(v||"").split(/[,;\s]+/).map(x=>x.trim().replace(/^<|>$/g,"")).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)).join(", ");
}
// ---------------------------------------------------------------- tenants as separate rows (13 Oct, tracker item 27)
// Each job keeps tenantList = [{name, phone, email}]. The old text fields are still filled from it, because the
// calendar, dashboard, Sheet columns and the process emails (Apps Script reads tenantEmails) all use them:
//   tenants      = "Name phone; Name phone"   tenantEmails = "a@x.com, b@y.com"
// If another device or the link action changed the text fields, the rows are rebuilt from them.
const MAX_TENANTS = 6;
const EMAIL_RE_G = /[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/g;
const TPHONE_RE_G = /(?:\+\d{1,3}[\s-]?|\b0)\d(?:[\s-]?\d){8,11}\b/g;
function tenantsText(list){
  return (list||[]).map(t => [t.name, t.phone].map(s=>String(s||"").trim()).filter(Boolean).join(" ")).filter(Boolean).join("; ");
}
function tenantEmailsText(list){ return cleanEmails((list||[]).map(t=>t.email||"").join(", ")); }
function tenantPhonesText(list){ return (list||[]).map(t=>String(t.phone||"").trim()).filter(Boolean).join(", "); }
function splitTenants(text){
  // Free text such as "Ms Jo Bloggs - 07700 900000 | jo@x.com & Sam Lee 07700 900001 sam@y.com" or
  // "Amy Fox, Ben Hart, <ben@x.com>" -> rows in the order they appear. A name starts a new row
  // once the current row has a name; a phone or email starts one if the current row already has that field.
  const s = String(text||"");
  const marks = [];
  s.replace(EMAIL_RE_G, (m, i) => { marks.push({ i, end:i+m.length, kind:"email", v:m }); return m; });
  s.replace(TPHONE_RE_G, (m, i) => { if (!marks.some(k => i < k.end && i+m.length > k.i)) marks.push({ i, end:i+m.length, kind:"phone", v:m.trim() }); return m; });
  marks.sort((a,b)=>a.i-b.i);
  const tokens = [];
  let pos = 0;
  // 13 Oct (booking scan): agents' emails carry labels round the details ("Tenant 1", "Email / Mobile",
  // "Email:", "Full Name:", "• Lead Tenant •"). Labels are dropped so they don't become extra tenants.
  const LABEL_RE = /^(?:full\s+name|name|e-?mail(?:\s+address)?|phone|mobile|mob|tel|telephone|number|contact(?:\s+details)?|details|lead\s+tenant|tenants?(?:\s*\d+)?|tenant\s+name)\b\s*/i;
  const pushNames = chunk => chunk.split(/[,;|&\/\n•·]+|\s+and\s+|\s+-\s+|\s{3,}/i).forEach(part => {
    let n = part.replace(/[<>()\[\]"':*]/g," ").replace(/\s+/g," ").trim();
    for (let k = 0; k < 4 && LABEL_RE.test(n); k++) n = n.replace(LABEL_RE, "").trim();
    n = n.replace(/\s+(?:e-?mail|phone|mobile|mob|tel|number|lead\s+tenant|tenant)$/i, "").trim();   // label just before a phone/email
    if (/[A-Za-z]{2,}/.test(n)) tokens.push({ kind:"name", v:n });
  });
  marks.forEach(m => { pushNames(s.slice(pos, m.i)); tokens.push(m); pos = m.end; });
  pushNames(s.slice(pos));
  const rows = [];
  let cur = null;
  tokens.forEach(t => {
    if (!cur || cur[t.kind]) { cur = { name:"", phone:"", email:"" }; rows.push(cur); }
    cur[t.kind] = t.v;
  });
  return rows;
}
function addEmailsToRows(rows, emailsText){
  // put each email not already on a row into the first row without an email, else a new row
  const have = rows.map(r => (r.email||"").toLowerCase());
  cleanEmails(emailsText).split(", ").filter(Boolean).forEach(e => {
    if (have.indexOf(e.toLowerCase()) !== -1) return;
    const free = rows.find(r => !r.email);
    if (free) free.email = e; else rows.push({ name:"", phone:"", email:e });
    have.push(e.toLowerCase());
  });
  return rows;
}
function tenantRowsFor(j){
  const list = Array.isArray(j.tenantList) ? j.tenantList.map(t => ({ name:t.name||"", phone:t.phone||"", email:t.email||"" })) : null;
  if (list && tenantsText(list) === String(j.tenants||"").trim()){
    // rows still match the text: only bring the emails in line (the link action may have changed them)
    const want = cleanEmails(j.tenantEmails).toLowerCase().split(", ").filter(Boolean);
    list.forEach(r => { if (r.email && want.indexOf(r.email.toLowerCase()) === -1) r.email = ""; });
    return addEmailsToRows(list, j.tenantEmails).filter(r => r.name || r.phone || r.email);
  }
  return addEmailsToRows(splitTenants(j.tenants), j.tenantEmails);
}
function tenantsNeedCheck(j){
  // true when the rows were worked out from old free text (shown to Lex until he saves)
  return !!String(j.tenants||"").trim() && !(Array.isArray(j.tenantList) && tenantsText(j.tenantList) === String(j.tenants||"").trim());
}

// ---------------------------------------------------------------- quick extract (offline, regex-based)
const UK_POSTCODE = /([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})/i;

function quickExtract(raw){
  const postcodeLineMatch = raw.split("\n").find(l => UK_POSTCODE.test(l));
  let street = "", town = "", postcode = "";
  if (postcodeLineMatch){
    const pcMatch = postcodeLineMatch.match(UK_POSTCODE);
    postcode = (pcMatch[1] + " " + pcMatch[2]).toUpperCase();
    const rest = postcodeLineMatch.replace(pcMatch[0], "").split(",").map(s=>s.trim()).filter(Boolean);
    if (rest.length===1){ street = rest[0]; }
    else if (rest.length>1){ town = rest[rest.length-1]; street = rest.slice(0,-1).join(", "); }
  }
  let dateIso = "";
  const dmY = raw.match(/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})\b/);
  if (dmY){
    let [,d,m,y] = dmY;
    if (y.length===2) y = "20"+y;
    dateIso = y+"-"+pad2(m)+"-"+pad2(d);
  }
  let type = "ICI";
  const low = raw.toLowerCase();
  if (low.includes("mid-term") || low.includes("mid term") || low.includes("interim")) type = "MTI";
  else if (low.includes("check-out") || low.includes("check out") || low.includes("checkout")) type = "CO";
  else if (low.includes("schedule of condition")) type = "SOC";
  else if (low.includes("clean")) type = "CLN";
  else if (low.includes("check-in") || low.includes("check in") || low.includes("checkin") || low.includes("inventory")) type = "ICI";

  return { type, date: dateIso, address: street, town, postcode };
}

function runExtract(){
  const raw = document.getElementById("extractRaw").value;
  if (!raw.trim()) return;
  captureFormValues();
  const found = quickExtract(raw);
  Object.assign(state.editing, {

    date: found.date || state.editing.date,
    address: found.address || state.editing.address,

}

  state.jobs = state.jobs.filter(j=>j.id!==id);
  saveJobs();
  render();
  setTimeout(() => showUndo((job.jobNo||"Job")+" deleted", { __deleted: copy }), 0);   // D8, 20 Oct: undo for delete
  return true;
}

function cycleStatus(id){
  const j = state.jobs.find(x=>x.id===id);
  if (!j) return;
  const NEXT = { booked:"processing", processing:"completed", completed:"sent", sent:"signed", signed:"archived", deemed:"archived" };
  const next = NEXT[j.status];
  if (!next) return;                               // archived is the end
  const before = snapJob(j);
  setJobStatus(j, next);
  saveJobs();
  render();
  showUndo(`${j.jobNo || "Job"} moved to ${statusMeta(next).label}`, before);
}

// ---------------------------------------------------------------- undo (12 Oct)
// A pill click changes the job straight away. For a few seconds an Undo bar puts the job back exactly as it was.
function snapJob(j){ return JSON.parse(JSON.stringify(j)); }
let undoTimer = null, undoSnap = null;
function showUndo(msg, before){
  undoSnap = before;
  let bar = document.getElementById("undo-bar");
  if (!bar){ bar = document.createElement("div"); bar.id = "undo-bar"; document.body.appendChild(bar); }
  bar.innerHTML = `<span>${esc(msg)}</span><button onclick="doUndo()">Undo</button><button class="undo-x" onclick="hideUndo()" aria-label="Close">✕</button>`;
  bar.classList.add("show"); document.body.classList.add("undo-on");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(hideUndo, 8000);
}
function hideUndo(){ const bar = document.getElementById("undo-bar"); if (bar) bar.classList.remove("show"); document.body.classList.remove("undo-on"); undoSnap = null; }
function doUndo(){
  if (!undoSnap) return hideUndo();
  if (undoSnap.__deleted){   // put a deleted job back; its calendar event was removed, so it gets a new one
    const back = undoSnap.__deleted; delete back.gcalEventId;
    if (!state.jobs.some(x => x.id === back.id)){ logChange(back, "Restored after delete"); state.jobs.push(back); saveJobs(); try { syncJobToCalendar(back); } catch(e){} render(); }
    return hideUndo();
  }
  const j = state.jobs.find(x => x.id === undoSnap.id);
  if (j){ Object.keys(j).forEach(k => delete j[k]); Object.assign(j, undoSnap); saveJobs(); render(); }
  hideUndo();
}
// Job still at Booked after its visit time: mark the visit done. The report countdown keeps counting
// from the visit time (not from this click), so an overdue report stays overdue.
function markVisited(id){
  const j = state.jobs.find(x=>x.id===id);
  if (!j || j.status !== "booked") return;
  const before = snapJob(j), v = visitTime(j);
  setJobStatus(j, "processing");
  if (v) j.processingAt = v.toISOString();
  saveJobs();
  render();
  showUndo(`${j.jobNo || "Job"} marked visited (Processing)`, before);
}

const CHECKIN_WAYS = {

const CHECKIN_LEAD_DEFAULT = 75;
function findClientLoose(name){
  const low = String(name||"").toLowerCase().replace(/[^a-z]/g,""); if (!low) return null;

      || state.clients.find(c=>{ const k=c.name.toLowerCase().replace(/[^a-z]/g,""); return k && (k.includes(low)||low.includes(k)); }) || null;
}
function checkinWay(clientName){
  const c = findClientLoose(clientName);
  if (c && (c.checkinWay === "ask" || c.checkinWay === "agent")) return c.checkinWay;
  const n = String((c && c.name) || clientName || "");
  if (/mcqueens|move\s*lettings|jags/i.test(n)) return "ask";    // starting values from how Lex works (20 Oct); change per agent
  if (/^winkworth/i.test(n)) return "agent";

function checkinLead(clientName){
  const c = findClientLoose(clientName), n = c ? Number(c.checkinLead) : NaN;

const CI_KIND_WORDS = { ask:"Email asking the tenants for their time", confirm:"Confirmation email", propose:"Email suggesting your time" };
async function ciAutoSend(j, kind, fallbackUrl){
  state.ciBusy = j.id; render();
  let err = "";
  try {
    clearTimeout(cloudSaveTimer);
    await dashSave();                                   // the script builds the email from the saved job
    if (state.cloudStatus !== "saved") throw new Error("the job couldn't be saved to the Job Log first");
    const d = await dashCall("ciSend", { job: j.jobNo, kind });
    if (!d || !d.ok) throw new Error((d && d.error) || "no answer from the WPS script");
    const when = new Date();
    if (kind === "ask") j.tenantsAskedAt = when.toISOString();
    ciAddNote(j, CI_KIND_WORDS[kind]+" sent by the dashboard "+ciDay(when)+" "+pad2(when.getHours())+":"+pad2(when.getMinutes())+" to "+d.to+(d.cc ? " (cc "+d.cc+")" : "")+".");
    saveJobs();

function minusMins(hhmm, mins){

}

function saveRearrange(id){

function ensureGCalToken(onReady){
  if (keyMode()){ onReady(); return; }

function gcalEventSummary(j){
  const tm = typeMeta(j.type);
  return [j.jobNo, tm.code, fullAddress(j)].filter(Boolean).join(" - ");
}
function gcalEventBody(j){
  const tz = "Europe/London";
  let start, end;
  if (j.date && j.time){
    start = { dateTime: j.date+"T"+j.time+":00", timeZone: tz };
    const parts = j.time.split(":").map(Number);
    let eh = parts[0]+1, em = parts[1];
    if (eh>23){ eh=23; em=59; }
    end = { dateTime: j.date+"T"+pad2(eh)+":"+pad2(em)+":00", timeZone: tz };
  } else if (j.date){
    start = { date: j.date };
    // all-day events: Google's end date is exclusive, so it must be the day after
    const nd = new Date(j.date+"T00:00:00Z"); nd.setUTCDate(nd.getUTCDate()+1);
    end = { date: nd.toISOString().slice(0,10) };
  } else {
    return null;
  }
  const descParts = [];
  if (j.client) descParts.push("Agent: "+j.client);
  if (j.tenants) descParts.push("Tenant/contact: "+j.tenants);
  if (j.tenantEmails) descParts.push("Tenant emails: "+j.tenantEmails);
  if (j.agentEmail) descParts.push("Copy to: "+j.agentEmail);
  if (keysLine(j)) descParts.push("Keys: "+keysLine(j));
  if (j.notes) descParts.push("Notes: "+j.notes);
  return { summary: gcalEventSummary(j), location: fullAddress(j), description: descParts.join("\n"), start, end };
}
function syncJobToCalendar(job){
  if (!state.gcalConnected || !job) return;
  const body = gcalEventBody(job);
  if (!body){ alert("Add a date before syncing this job to the calendar."); return; }
  ensureGCalToken(function(){
    const base = "https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(GCAL_CALENDAR_ID)+"/events";
    const isUpdate = !!job.gcalEventId;
    if (keyMode()){
      dashCall("calSave", { eventId: job.gcalEventId || "", body }).then(function(d){
        if (!d.ok) throw new Error(d.error || "no answer");
        if (d.id && job.gcalEventId !== d.id){ job.gcalEventId = d.id; saveJobs(); render(); }
      }).catch(function(err){
        console.error("Calendar sync failed", err);
        alert("Couldn't update the calendar for "+(job.jobNo||"this job")+". Your change to the job is still kept in the Job Log.\n\n"+err.message);
      });
      return;
    }
    const url = isUpdate ? base+"/"+job.gcalEventId : base;
    // PATCH merges with the existing event, so an all-day event changed to a timed one kept its old
    // "date" alongside the new "dateTime" and Google refused it (13 Oct). Clear the other kind explicitly.
    if (isUpdate){
      if (body.start.dateTime){ body.start.date = null; body.end.date = null; }
      else { body.start.dateTime = null; body.end.dateTime = null; body.start.timeZone = null; body.end.timeZone = null; }
    }
    fetch(url, {
      method: isUpdate ? "PATCH" : "POST",
      headers: { "Authorization": "Bearer "+state.gcalToken, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(async function(r){
      if (!r.ok){
        let why = "";
        try { const e = await r.json(); why = (e && e.error && e.error.message) || ""; } catch(x){}
        throw new Error("Google said "+r.status+(why ? ": "+why : ""));
      }
      return r.json();
    }).then(function(data){
      if (data.id && job.gcalEventId !== data.id){
        job.gcalEventId = data.id;
        saveJobs();
        render();
      }
    }).catch(function(err){
      console.error("Calendar sync failed", err);
      alert("Couldn't update the calendar for "+(job.jobNo||"this job")+". Your change to the job is still kept in the Job Log.\n\n"+err.message);
    });
  });
}
// Removes a job's calendar event. Google's answer is checked (13 Oct): 404/410 means it was already gone.
// On any other failure a message says so, so a missed visit doesn't silently stay on the calendar.
function deleteJobCalendarEvent(job, onDone){
  if (!state.gcalConnected || !job || !job.gcalEventId){ if (onDone) onDone(false); return; }
  const label = job.jobNo || "this job";
  const fail = function(why){
    console.error("Calendar delete failed", label, job.gcalEventId, why);
    showActionBar("Couldn't remove the calendar event for "+label+" ("+why+"). Delete it in Google Calendar by hand.");
    if (onDone) onDone(false);
  };
  ensureGCalToken(function(){
    if (keyMode()){
      dashCall("calDelete", { eventId: job.gcalEventId }).then(function(d){ if (d.ok){ if (onDone) onDone(true); } else fail(d.error || "no answer"); })
        .catch(function(err){ fail(String(err && err.message || err)); });
      return;
    }
    fetch("https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(GCAL_CALENDAR_ID)+"/events/"+job.gcalEventId, {
      method: "DELETE",
      headers: { "Authorization": "Bearer "+state.gcalToken }
    }).then(function(r){
      if (r.ok || r.status === 404 || r.status === 410){ if (onDone) onDone(true); }
      else fail("Google said "+r.status);
    }).catch(function(err){ fail(String(err && err.message || err)); });
  });
}

// ---------------------------------------------------------------- booking review tray (reads Claude's queue drafts from Gmail)
/*
  Claude's scheduled inbox check writes Gmail drafts titled "WPS Job Log Queue …"
  in info@. Each draft carries a wps-queue.json attachment:
    { "version":1, "generatedAt":"ISO", "items":[ {id, kind:"new"|"update"|"cancel", type, client,
      date:"YYYY-MM-DD", time:"HH:MM", address, town, postcode, tenants, notes, summary,
      sourceFrom, sourceSubject, sourceDate, sourceUrl} ] }
  Nothing here writes to Gmail — approving/rejecting is remembered in this browser.
*/
function gmailGranted(resp){
  try { return google.accounts.oauth2.hasGrantedAllScopes(resp, GMAIL_SCOPE); } catch(e){ return false; }
}
function ensureGmailToken(onReady){
  if (keyMode()){ onReady(); return; }
  if (state.gcalToken && state.gmailOk && Date.now() < state.gcalTokenExpiry - 60000){ onReady(); return; }
  if (!gcalTokenClient){ initGCal(); }
  if (!gcalTokenClient){ state.queueBusy=false; state.queueMsg="Google sign-in hasn't loaded yet — check your connection and try again."; render(); return; }
  gcalTokenClient.callback = function(resp){
    if (resp.error){ state.queueBusy=false; state.queueMsg="Google sign-in was cancelled."; render(); return; }
    state.gcalToken = resp.access_token;
    state.gcalTokenExpiry = Date.now() + (resp.expires_in*1000);
    state.gmailOk = gmailGranted(resp); state.sheetsOk = sheetsGranted(resp);
    if (!state.gcalConnected && google.accounts.oauth2.hasGrantedAllScopes(resp, GCAL_SCOPE)){
      state.gcalConnected = true; try{ localStorage.setItem(LS_GCAL_PREF, "1"); }catch(e){}
    }
    if (!state.gmailOk){
      state.queueBusy=false;
      state.queueMsg='Gmail access wasn\'t ticked. Click "Check for new bookings" again and allow "View your email messages" (read-only).';
      render(); return;
    }
    onReady();
  };
  // first time (or scope missing) needs the consent screen; after that it's silent
  gcalTokenClient.requestAccessToken({ prompt: state.gmailOk ? "" : "consent" });
}
function b64ToText(s){
  s = String(s||"").replace(/\s+/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
async function gmailGet(path){
  const r = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/"+path, { headers:{ "Authorization":"Bearer "+state.gcalToken } });
  if (!r.ok){ const e = new Error("Gmail API "+r.status); e.status = r.status; throw e; }
  return r.json();
}
function walkParts(part, out){
  if (!part) return out;
  out.push(part);
  (part.parts||[]).forEach(p=>walkParts(p,out));
  return out;
}
async function readQueuePayload(draftId){
  const dr = await gmailGet("drafts/"+draftId+"?format=full");
  const msg = dr.message || {};
  const parts = walkParts(msg.payload, []);
  // 1) the JSON attachment
  const att = parts.find(p => /\.json$/i.test(p.filename||"") || /application\/json/i.test(p.mimeType||""));
  if (att){
    let data = att.body && att.body.data;
    if (!data && att.body && att.body.attachmentId){
      const a = await gmailGet("messages/"+msg.id+"/attachments/"+att.body.attachmentId);
      data = a.data;
    }
    if (data) return JSON.parse(b64ToText(data));
  }
  // 2) fallback: base64 block between markers in the plain-text body
  const txtPart = parts.find(p => /text\/plain/i.test(p.mimeType||"") && p.body && p.body.data);
  if (txtPart){
    const txt = b64ToText(txtPart.body.data);
    const m = txt.match(/===WPS-QUEUE-BEGIN===([\s\S]*?)===WPS-QUEUE-END===/);
    if (m){
      const block = m[1].replace(/\r/g,"").trim();
      if (block.startsWith("{")){
        try { return JSON.parse(block); } catch(e){}
        // tolerate soft line-wrapping added by some mail paths
        return JSON.parse(block.replace(/\n(?!\s*[{\]"])/g, ""));
      }
      return JSON.parse(b64ToText(block));
    }
  }
  return null;
}
// Builds the review tray from the queue drafts' contents (same for Google sign-in and the device key).
// quiet = background read: the tray only opens if something new arrived or a job was marked automatically.
function queueFromPayloads(payloads, quiet){
  const before = new Set(pendingQueue().map(i => i.id));
  const byId = {};
  payloads = payloads.filter(p => p && Array.isArray(p.items));
  payloads.sort((a,b)=>String(a.generatedAt||"").localeCompare(String(b.generatedAt||"")));
  payloads.forEach(p=>p.items.forEach(it=>{ if (queueItemOk(it)) byId[it.id] = Object.assign({ generatedAt:p.generatedAt }, it); }));
  state.queue = Object.values(byId).sort((a,b)=>String(a.date||"9999").localeCompare(String(b.date||"9999")));
  state.queueCheckedAt = new Date();
  if (!quiet) state.autoSentMsg = "";
  const msgBefore = state.autoSentMsg;
  applySentItems();     // 17 Oct: reports the auto-send script emailed are marked Sent with no click
  applySignedItems();   // 19 Oct: "signed" items from the signing page, if the script ever writes them
  const fresh = pendingQueue().some(i => !before.has(i.id));
  if (!quiet || fresh || state.autoSentMsg !== msgBefore) state.queueChecked = true;
  if (!quiet && !payloads.length) state.queueMsg = "No queue from Claude in your drafts yet.";
}
async function dashQueue(quiet){
  if (!quiet){ state.queueBusy = true; state.queueMsg = ""; render(); }
  try {
    const d = await dashCall("queue");
    if (!d.ok) throw new Error(d.error || "no answer");
    queueFromPayloads(d.payloads || [], quiet);
  } catch(e){
    console.error(e);
    if (!quiet) state.queueMsg = "Couldn't read the booking queue: "+e.message;
  } finally {
    if (!quiet) state.queueBusy = false;
    safeRender();
  }
}
function checkForBookings(quiet){
  if (keyMode()) return dashQueue(quiet === true);
  state.queueBusy = true; state.queueMsg = ""; state.autoSentMsg = ""; render();
  ensureGmailToken(async function(){
    try{
      const list = await gmailGet("drafts?maxResults=50&q="+encodeURIComponent('subject:"'+QUEUE_SUBJECT+'"'));
      const drafts = list.drafts || [];
      const payloads = [];
      for (const d of drafts){
        try{ const p = await readQueuePayload(d.id); if (p && Array.isArray(p.items)) payloads.push(p); }
        catch(e){ console.warn("Skipped a queue draft", d.id, e); }
      }
      queueFromPayloads(payloads, false);
      if (!drafts.length) state.queueMsg = "No queue from Claude in your drafts yet.";
    } catch(e){
      console.error(e);
      state.queueMsg = (e.status===403)
