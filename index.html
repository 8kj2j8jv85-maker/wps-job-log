<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wellington Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light only;
    --paper:#F5F7FB; --paper-deep:#E9EEF6;
    --ink:#1B1D21; --ink-soft:#5C6470;
    --brand:#1F2D5A; --brand-dark:#141D3D;
    --peri:#4A5B8A; --peri-bg:#E7EAF3;
    --coral:#E0684B; --coral-dark:#C8553A; --coral-bg:#FBE7E1;
    --sky:#C9D6E8;
    --line:#DFE3E9; --line-soft:#EEF1F5;
    --stone:#7A8493; --stone-bg:#E9ECF0;
    --white:#FFFFFF;
  }
  html{ color-scheme: light only; background:#F4F7FB; background:var(--paper); width:100%; min-height:100%; }
  * { box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    margin:0; min-height:100vh; width:100%;
    background:#F4F7FB; background:var(--paper);
    color:var(--ink);
    font-family: 'Jost','Helvetica Neue','Segoe UI',Arial,sans-serif;
    color-scheme: light only;
  }
  #app{ background:#F4F7FB; background:var(--paper); min-height:100vh; }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 36px 60px; background:var(--paper); }
  .serif{ font-family:'Cormorant Garamond', Georgia, serif; }
  .mono{ font-family:'IBM Plex Mono','Consolas',monospace; }
  a{ color:inherit; }

  /* header */
  .header-band{ background:var(--brand); padding:20px 0; }
  .header-inner{
    max-width:1040px; margin:0 auto; padding:0 22px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
  }
  .brand-row{ display:flex; align-items:center; gap:14px; }
  .logo-badge{
    width:46px; height:46px; border-radius:11px; background:var(--white);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-name{ display:flex; align-items:baseline; gap:9px; }
  .brand-name .name{ font-size:22px; font-weight:600; color:var(--white); letter-spacing:-0.01em; }
  .brand-name .sub{ font-size:10.5px; font-weight:600; color:var(--sky); letter-spacing:0.14em; }
  .tool-tag{ font-size:12px; font-weight:500; color:var(--sky); margin-top:2px; opacity:.85; }

  .utility-row{ display:flex; justify-content:flex-end; gap:20px; padding:14px 0 4px; }
  .btn-link{ display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--ink-soft); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:4px 2px; }
  .btn-link:hover{ color:var(--brand); }

  .btn{ display:inline-flex; align-items:center; gap:7px; border:none; border-radius:7px; padding:10px 16px; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit; }
  .btn-coral{ background:var(--coral); color:var(--white); }
  .btn-coral:hover{ background:var(--coral-dark); }
  .btn-ghost{ background:none; border:1px solid var(--line); color:var(--ink-soft); }
  .btn-ghost:hover{ background:var(--line-soft); }
  .btn-text{ background:none; border:none; color:var(--peri); cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:600; padding:0; }
  .btn-sm{ padding:6px 10px; font-size:12.5px; border-radius:6px; }

  /* Today dashboard */
  .today-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; margin:20px 0; }
  .t-card{ background:var(--white); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .t-card.wide{ grid-column:1/-1; }
  .t-card h3{ margin:0 0 10px; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-weight:600; font-size:21px; color:var(--brand); display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .t-card h3 .count{ font-family:'Jost',Arial,sans-serif; font-style:normal; font-size:13px; font-weight:600; color:var(--ink-soft); }
  .t-row{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line-soft); font-size:14px; }
  .t-row:first-of-type{ border-top:none; }
  .t-time{ min-width:52px; font-weight:600; color:var(--brand); }
  .t-main{ flex:1; min-width:0; }
  .t-main .sub{ color:var(--ink-soft); font-size:12.5px; margin-top:2px; }
  .t-empty{ color:var(--stone); font-size:13.5px; padding:6px 0; }
  .t-link{ background:none; border:none; padding:0; color:var(--peri); font:inherit; font-weight:600; cursor:pointer; text-align:left; }
  .t-links{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .t-links a{ display:block; padding:10px 12px; border:1px solid var(--line); border-radius:8px; color:var(--brand); text-decoration:none; font-weight:600; font-size:13.5px; background:var(--paper); }
  .t-links a:hover{ border-color:var(--peri); }
  .t-big{ font-size:30px; font-weight:600; line-height:1; }
  .wk-strip{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; }
  .wk-day{ background:var(--paper); border:1px solid var(--line-soft); border-radius:8px; padding:8px; min-height:110px; display:flex; flex-direction:column; gap:6px; }
  .wk-day.wk-end{ background:var(--paper-deep); }
  .wk-head{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .wk-head span{ color:var(--brand); }
  .wk-job{ text-align:left; background:var(--white); border:1px solid var(--line); border-left:3px solid var(--peri); border-radius:6px; padding:6px 7px; cursor:pointer; font-family:inherit; }
  .wk-t{ font-size:12px; font-weight:600; color:var(--brand); }
  .wk-a{ font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wk-c{ font-size:11.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wk-free{ font-size:12px; color:var(--stone); }
  .wk-add{ margin-top:auto; background:none; border:none; color:var(--peri); font:inherit; font-size:12px; text-align:left; cursor:pointer; padding:0; }
  @media (max-width:900px){ .wk-strip{ grid-template-columns:1fr; } .wk-day{ min-height:0; } }


  /* compact dashboard (one screen) */
  .wrap-dash{ max-width:1560px; }
  .wrap-dash .page-head{ padding-top:20px; }
  .d-tiles{ display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:6px 8px; margin:14px 0 12px; }
  .d-tile{ text-align:left; background:var(--white); border:1.5px solid var(--line); border-radius:9px; padding:8px 10px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; min-width:0; }
  .d-tile:hover{ border-color:var(--peri); }
  .d-tile.on{ border-color:var(--brand); background:var(--sky); }
  .d-num{ font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; font-size:26px; line-height:1.05; }
  .d-lbl{ font-size:12px; font-weight:600; color:var(--ink); line-height:1.25; }
  .d-sub{ font-size:11px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .d-row{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.6fr); gap:12px; margin-bottom:12px; }
  .d-card{ padding:12px 16px; }
  .d-card h3{ font-size:19px; margin-bottom:6px; }
  .d-route{ text-decoration:none; margin-right:10px; padding:4px 9px; border-radius:6px; background:var(--brand); color:#fff; font-size:12px; font-weight:600; }
  .c-row{ display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line-soft); font-size:13.5px; min-width:0; }
  .c-row:first-of-type{ border-top:none; }
  .c-when{ flex:0 0 auto; min-width:64px; font-weight:600; color:var(--brand); white-space:nowrap; }
  .c-job{ flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; font:inherit; color:var(--peri); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c-job b{ font-weight:600; }
  .c-dim{ color:var(--ink-soft); font-weight:400; }
  .d-panel .t-row{ padding:6px 0; font-size:13.5px; }
  .d-more{ font-size:12.5px; margin-top:6px; margin-right:16px; }
  .d-note{ font-size:12px; color:var(--stone); margin-top:6px; }
  .d-wk{ min-height:0; padding:6px; gap:4px; }
  .d-wk .wk-head{ display:flex; align-items:center; gap:4px; }
  .d-add{ margin:0 0 0 auto; font-size:16px; line-height:1; padding:0 2px; }
  .d-wkjob{ padding:4px 6px; }
  .d-wkjob .wk-t{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side-links{ display:flex; flex-direction:column; gap:1px; }
  .side-links .side-label{ font-size:11px; font-weight:600; letter-spacing:.16em; color:#8A97B8; padding:0 14px 6px; }
  .side-links a{ color:var(--sky); font-size:13.5px; text-decoration:none; padding:5px 14px; border-radius:6px; }
  .side-links a:hover{ background:rgba(255,255,255,.06); color:#fff; }
  #undo-bar{ position:fixed; left:50%; bottom:20px; transform:translate(-50%,140%); display:flex; align-items:center; gap:14px; max-width:calc(100vw - 32px); padding:10px 12px 10px 16px; background:var(--brand); color:#fff; border-radius:10px; font-size:14px; box-shadow:0 6px 24px rgba(31,45,90,.28); opacity:0; transition:transform .2s, opacity .2s; z-index:999; pointer-events:none; }
  #undo-bar.show{ transform:translate(-50%,0); opacity:1; pointer-events:auto; }
  #undo-bar button{ border:0; border-radius:6px; background:var(--coral); color:#fff; font:inherit; font-weight:600; padding:6px 12px; cursor:pointer; }
  #undo-bar button.undo-x{ background:transparent; padding:6px 4px; font-weight:400; opacity:.8; }
  @media (max-width:600px){ #undo-bar{ width:calc(100vw - 32px); box-sizing:border-box; justify-content:space-between; bottom:12px; } #undo-bar span{ flex:1; } }
  .d-info{ display:flex; flex-direction:column; gap:2px; margin:-2px 0 6px; padding-left:74px; font-size:12.5px; color:var(--ink); line-height:1.4; }
  .d-tel{ color:var(--coral-dark); font-weight:600; text-decoration:none; white-space:nowrap; }
  @media (max-width:600px){ .d-info{ padding-left:0; font-size:13px; } }
  .d-sect{ margin:2px 0 6px; font-size:12.5px; font-weight:600; color:var(--coral-dark); letter-spacing:.02em; }
  .d-mv{ white-space:nowrap; border:1px solid var(--coral); background:#fff; color:var(--coral-dark); border-radius:6px; padding:3px 9px; font-size:12px; font-weight:600; cursor:pointer; }
  .d-mv:hover{ background:var(--coral-bg); }
  .d-acts{ display:inline-flex; gap:6px; flex-wrap:wrap; }
  .rr-box{ margin:4px 0 10px; padding:10px 12px; border:1px solid #E3B5A8; border-radius:8px; background:#FFF8F5; font-size:13px; }
  .rr-box .rr-t{ font-weight:600; color:var(--coral-dark); margin-bottom:6px; }
  .rr-box .rr-f{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin:6px 0; }
  .rr-box label{ display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--stone); }
  .rr-box input[type=date], .rr-box input[type=time]{ font:inherit; padding:5px 7px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  .rr-box .rr-chk{ flex-direction:row; align-items:center; gap:6px; color:var(--ink); font-size:13px; margin:4px 0 8px; }
  .rr-box .rr-b{ display:flex; gap:8px; flex-wrap:wrap; }
  .rr-warn{ color:#B42318; font-size:12px; margin-top:4px; }
  .rr-tag{ white-space:nowrap; font-size:11.5px; color:var(--coral-dark); background:var(--coral-bg); border-radius:5px; padding:2px 7px; }
  .d-ghead{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); padding:0 2px 2px; border-bottom:2px solid var(--line); margin-bottom:-2px; }
  .d-ghead.d-g-todo{ border-color:var(--coral); } .d-ghead.d-g-wait{ border-color:var(--peri); } .d-ghead.d-g-money{ border-color:var(--brand); } .d-ghead.d-g-perf{ border-color:#2E6B45; }
  .d-tile.zero{ opacity:.55; } .d-tile.zero:hover{ opacity:1; }
  @media (min-width:1251px){ .d-tile.d-gstart{ margin-left:6px; } .d-ghead.d-g-wait, .d-ghead.d-g-money, .d-ghead.d-g-perf{ margin-left:6px; } }
  @media (max-width:1250px){ .d-ghead{ display:none; } .d-tile{ border-top-width:3px; } .d-tile.d-g-todo{ border-top-color:var(--coral); } .d-tile.d-g-wait{ border-top-color:var(--peri); } .d-tile.d-g-money{ border-top-color:var(--brand); } .d-tile.d-g-perf{ border-top-color:#2E6B45; } }
  @media (max-width:1250px){ .d-tiles{ grid-template-columns:repeat(5,minmax(0,1fr)); } }
  @media (max-width:900px){ .d-row{ grid-template-columns:1fr; } .d-tiles{ grid-template-columns:repeat(2,minmax(0,1fr)); } .c-row{ flex-wrap:wrap; } .c-job{ white-space:normal; } }

  /* status strip */
  .status-strip{ display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:10px; margin:20px 0; }
  .due{ display:block; margin-top:4px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .due-ok{ color:var(--ink-soft); } .due-soon{ color:#8A5A00; } .due-late{ color:#B42318; }
  tr.row-late td{ background:#FDF0EE; }
  .status-card{ text-align:left; border:1.5px solid var(--line); background:var(--white); border-radius:9px; padding:12px 14px; cursor:pointer; font-family:inherit; }
  .status-card .num{ font-size:24px; font-weight:700; font-family:'Cormorant Garamond',Georgia,serif; }
  .status-card .lbl{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }

  /* toolbar */
  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .search-wrap{ position:relative; flex:1 1 220px; }
  .search-wrap svg{ position:absolute; left:10px; top:11px; }
  input[type=text], input[type=date], input[type=time], input[type=email], input[type=tel], select, textarea{
    font-family:inherit; font-size:14.5px; color:var(--ink) !important; background:var(--white) !important;
    border:1px solid var(--line); border-radius:6px; padding:8px 10px; outline:none; width:100%;
    color-scheme: light only;
  }
  select{ background:var(--white) !important; }
  select option{ color:var(--ink); background:var(--white); }
  ::placeholder{ color:#8B95A3; opacity:1; }
  .search-wrap input{ padding-left:32px; }
  .filter-select{ width:180px; }
  textarea{ resize:vertical; min-height:70px; }

  /* form card */
  .form-card{ background:var(--white); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
  .form-card h3{ margin:0 0 14px; font-family:'Cormorant Garamond',Georgia,serif; font-size:19px; color:var(--brand); }
  .extract-box{ background:var(--peri-bg); border:1px dashed var(--peri); border-radius:9px; padding:14px; margin-bottom:18px; }
  .extract-box textarea{ margin-bottom:8px; }
  .extract-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .extract-hint{ font-size:12px; color:var(--ink-soft); }
  .field-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }
  .field{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .field.wide{ grid-column:1 / -1; }
  .field-hint{ font-size:11px; font-weight:400; color:var(--ink-soft); margin-top:-2px; }
  .add-client-row{ display:flex; flex-direction:column; gap:8px; }
  .add-client-row .row2{ display:flex; gap:8px; }
  .add-client-row .row3{ display:flex; gap:8px; justify-content:flex-end; }
  .agent-contact-box{ background:var(--paper-deep); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .agent-contact-line{ font-size:13px; color:var(--ink); margin-bottom:6px; }
  .agent-contact-edit-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:10px; }
  .agent-contact-actions{ display:flex; gap:8px; }
  .form-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; border-top:1px solid var(--line-soft); padding-top:16px; }
  /* job form: tenant rows, Copy to picker, delete (13 Oct) */
  .btn-danger{ background:#fff; border:1px solid #C0392B; color:#A93226; }
  .btn-danger:hover{ background:#FDEDEC; }
  .fa-gap{ flex:1; }
  .tenant-block, .copyto-block{ gap:6px; }
  .tb-head{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; }
  .tb-head .field-hint{ margin:0; }
  .tb-check{ font-size:12px; font-weight:400; color:var(--ink); background:var(--coral-bg); border-radius:6px; padding:6px 9px; }
  .tb-orig{ font-style:italic; }
  .tenant-row{ display:grid; grid-template-columns:22px 1.2fr 1fr 1.4fr 30px; gap:8px; align-items:center; }
  .tenant-row input{ min-width:0; }
  .tr-num{ font-size:12px; color:var(--ink-soft); text-align:center; }
  .tr-x{ justify-content:center; font-size:13px; }
  .tenant-block > .btn-text, .ct-actions .btn-text{ align-self:flex-start; padding:4px 0; }
  .ct-group{ display:flex; flex-wrap:wrap; gap:6px; }
  .ct-group > .ct-label{ width:100%; font-size:11.5px; font-weight:600; color:var(--ink-soft); cursor:default; }
  details.ct-group > summary{ cursor:pointer; list-style-position:inside; }
  .ct-item{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:#fff; font-weight:500; color:var(--ink); cursor:pointer; font-size:13px; max-width:100%; }
  .ct-item.on{ border-color:var(--peri); background:#EEF1FB; }
  .ct-item input{ margin:0; width:auto; }
  .ct-mail{ font-size:11.5px; color:var(--ink-soft); font-weight:400; overflow-wrap:anywhere; }
  .ct-del{ border:none; background:none; color:#A93226; cursor:pointer; font-size:12px; padding:0 2px; }
  .ct-status{ font-size:12px; font-weight:400; color:var(--ink-soft); overflow-wrap:anywhere; }
  .ct-add{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .ct-add input{ flex:1 1 160px; min-width:0; }
  .ct-actions{ display:flex; gap:16px; }

  /* table */
  .tablewrap{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--white); overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; }
  thead tr{ background:var(--paper-deep); }
  th{ text-align:left; font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; padding:10px 12px; white-space:nowrap; }
  td{ padding:12px; border-top:1px solid var(--line-soft); font-size:13.5px; vertical-align:top; }
  tr:hover td{ background:var(--paper); }
  .pill{ display:inline-block; white-space:nowrap; padding:4px 10px; border-radius:100px; font-size:12px; font-weight:600; cursor:pointer; border:none; font-family:inherit; }
  .type-badge{ display:inline-block; padding:3px 8px; border-radius:5px; font-size:11.5px; font-weight:600; background:var(--peri-bg); color:var(--peri); white-space:nowrap; }
  .row-actions{ display:flex; gap:6px; }
  .icon-btn{ background:none; border:none; cursor:pointer; padding:5px; border-radius:5px; color:var(--ink-soft); display:flex; }
  .icon-btn:hover{ background:var(--line-soft); color:var(--ink); }
  .empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); border:1px dashed var(--line); border-radius:10px; margin-top:16px; }
  .footer-line{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:16px; }

  /* view toggle */
  .view-toggle{ display:flex; gap:4px; background:var(--paper-deep); border-radius:8px; padding:3px; }
  .view-toggle button{ border:none; background:none; padding:7px 14px; border-radius:6px; font-family:inherit; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .view-toggle button.active{ background:var(--white); color:var(--brand); box-shadow:0 1px 2px rgba(31,45,58,0.12); }

  /* calendar */
  .cal-wrap{ background:var(--white); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .cal-title{ font-family:'Cormorant Garamond',Georgia,serif; font-size:18px; color:var(--brand); font-weight:600; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-weekdays{ margin-bottom:6px; }
  .cal-weekday{ text-align:center; font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; padding:4px 0; }
  .cal-cell{ min-height:96px; border:1px solid var(--line-soft); border-radius:7px; padding:6px; cursor:pointer; display:flex; flex-direction:column; gap:4px; background:var(--paper); }
  .cal-cell:hover{ border-color:var(--peri); }

<script src="https://accounts.google.com/gsi/client"></script>
<script>
/* =========================================================================
   Wellington Property Services — Job Log (standalone offline copy)
   No server, no account required. Jobs are stored only in this browser.
   Optional: connect Google Calendar to push each job as an event.
   ========================================================================= */

const LS_JOBS = "wps_standalone_jobs_v1";
const LS_CLIENTS = "wps_standalone_clients_v1";
const LS_GCAL_PREF = "wps_standalone_gcal_connected_v1";

// --- Google Calendar sync config ---
const GOOGLE_CLIENT_ID = "765734122916-80dtp83u92p7nsddd3o14hjf782ov4v1.apps.googleusercontent.com";
const GCAL_CALENDAR_ID = "info@wellingtonparker.com";
const GCAL_SCOPE = "https://www.googleapis.com/auth/calendar.events";
// Gmail (read-only) — used only to read the "WPS Job Log Queue" drafts Claude writes
const GMAIL_SCOPE = "https://www.googleapis.com/auth/gmail.readonly";
const QUEUE_SUBJECT = "WPS Job Log Queue";
const LS_QUEUE_DONE = "wps_standalone_queue_done_v1";
// Google Sheet master copy — drive.file only lets the Job Log see the files it created itself
const SHEETS_SCOPE = "https://www.googleapis.com/auth/drive.file";
const SHEET_NAME = "WPS Job Log";
// Read-only access to the WPS Amendments Sheet (made by the amendments form) for the Today dashboard
const AMEND_SCOPE = "https://www.googleapis.com/auth/spreadsheets.readonly";
const AMEND_SHEET_ID = "1FjRFw2l9L1T3DVbASn08NfSsvbxlGQAQ4Qu95CRK6gs";
const LS_SHEET_ID = "wps_job_log_sheet_id_v1";
const LS_JOBNO_HIGH = "wps_job_log_jobno_high_v1";   // highest job number ever used per month, so numbers never repeat after a delete
const LS_LOCAL_SAVED_AT = "wps_job_log_local_saved_at_v1";   // when this browser last changed data
const LS_CLOUD_SYNCED_AT = "wps_job_log_cloud_synced_at_v1"; // the Sheet's savedAt we last matched
let gcalTokenClient = null;

const TYPES = [
  { code:"ICI", label:"Inventory & Check-In" },
  { code:"CO",  label:"Check-Out" },
  { code:"MTI", label:"Mid-Term Inspection" },
  { code:"SOC", label:"Schedule of Condition" },
  { code:"CLN", label:"Clean Check" },
];

const STATUSES = [
  { code:"booked",     label:"Booked",     fg:"var(--coral-dark)", bg:"var(--coral-bg)" },
  { code:"processing", label:"Processing", fg:"#8A5A00",           bg:"#FFF1D0" },
  { code:"completed",  label:"Completed",  fg:"var(--peri)",       bg:"var(--peri-bg)" },
  { code:"sent",       label:"Sent",       fg:"var(--brand)",      bg:"var(--sky)" },
  { code:"signed",     label:"Signed",     fg:"#2E6B45",           bg:"#E0F0E6" },
  { code:"deemed",     label:"Deemed agreed", fg:"#2E6B45",        bg:"#E0F0E6" },
  { code:"archived",   label:"Archived",   fg:"var(--stone)",      bg:"var(--stone-bg)" },
];
// Report turnaround targets (hours from the visit) — change these to match what you promise agents
const TURNAROUND_HOURS = { CO:48, MTI:72, CLN:72, ICI:72, SOC:72 };
// Invoice tracking — separate from the report stages
const INVOICE_STATES = [
  { code:"",         label:"Not invoiced", fg:"var(--stone)", bg:"var(--stone-bg)" },
  { code:"invoiced", label:"Invoiced",     fg:"#8A5A00",      bg:"#FFF1D0" },
  { code:"paid",     label:"Paid",         fg:"#2E6B45",      bg:"#E0F0E6" },
];
const REPORT_OUT = ["sent","signed","deemed","archived"];   // report has gone out, so it should be invoiced
function invoiceMeta(c){ return INVOICE_STATES.find(s=>s.code===(c||"")) || INVOICE_STATES[0]; }
function needsInvoice(j){ return REPORT_OUT.includes(j.status) && !j.invoice; }
const DUE_STATUSES = ["booked","processing","completed"];   // report not yet sent

const DEFAULT_CLIENTS = [
  { name:"Winkworth - Bow", contactName:"", contactPhone:"", contactEmail:"" },
  { name:"McQueens",        contactName:"", contactPhone:"", contactEmail:"" },
  { name:"Move Lettings",   contactName:"", contactPhone:"", contactEmail:"" },
];
const ADD_NEW = "__add_new__";
// ---- help hints
const LS_HELP = "wps_help_on_v1";   // shared with the Photo Tool and Dictation (same site)
function hint(t){ return ` title="${esc(t)}" data-hint="${esc(t)}"`; }   // hover title + text shown under the button when Help is on
function tip(t){ return ` title="${esc(t)}"`; }                          // hover title only (small buttons, pills)
function helpBox(html){ return state.helpOn ? `<div class="help-box"><div class="hb-t">HOW THIS WORKS</div>${html}</div>` : ""; }
function toggleHelp(){ state.helpOn = !state.helpOn; lsSet(LS_HELP, state.helpOn ? "1" : "0"); render(); }

const TODAY = new Date();
let state = {
  jobs: [],
  clients: DEFAULT_CLIENTS.slice(),
  contacts: [],              // saved Copy to contacts (13 Oct)
  editing: null,             // job being added/edited, or null
  addingClient: false,
  editingAgentContact: false,
  search: "",
  statusFilter: "all",
  typeFilter: "all",
  clientFilter: "all",
  monthFilter: "all",
  view: "today",             // "today", "table" or "calendar"
  calYear: TODAY.getFullYear(),
  calMonth: TODAY.getMonth()+1,   // 1-12
  gcalConnected: false,
  gcalToken: null,
  gcalTokenExpiry: 0,
  gmailOk: false,
  queue: [],
  queueDone: {},
  queueChecked: false,
  queueBusy: false,
  queueMsg: "",
  queueCheckedAt: null,
  fromQueueId: null,
  helpOn: true,
};

// ---------------------------------------------------------------- storage
function normalizeClients(arr){
  if (!Array.isArray(arr)) return null;
  const out = arr.map(x => typeof x === "string"
    ? { name:x, contactName:"", contactPhone:"", contactEmail:"" }
    : { name:x.name||"", contactName:x.contactName||"", contactPhone:x.contactPhone||"", contactEmail:x.contactEmail||"" }
  ).filter(c=>c.name);
  return out.length ? out : null;
}
function load(){
  try { const j = localStorage.getItem(LS_JOBS); if (j) state.jobs = JSON.parse(j); } catch(e){}
  state.jobs.forEach(j=>{ if (j.status==="report_sent") j.status = "sent"; });
  try {
    const c = localStorage.getItem(LS_CLIENTS);
    if (c){ const norm = normalizeClients(JSON.parse(c)); if (norm) state.clients = norm; }
  } catch(e){}
  try { const k = normalizeContacts(JSON.parse(localStorage.getItem(LS_CONTACTS)||"null")); state.contacts = k || SEED_CONTACTS.map(c=>Object.assign({},c)); } catch(e){ state.contacts = SEED_CONTACTS.map(c=>Object.assign({},c)); }
  if (fillContactsFromData()) lsSet(LS_CONTACTS, JSON.stringify(state.contacts));
  try { state.gcalConnected = localStorage.getItem(LS_GCAL_PREF) === "1"; } catch(e){}
  try { state.helpOn = localStorage.getItem(LS_HELP) !== "0"; } catch(e){}
  if (location.hash === "#log") state.view = "table";
  try { const q = localStorage.getItem(LS_QUEUE_DONE); if (q) state.queueDone = JSON.parse(q) || {}; } catch(e){}
}
function getJobNoHigh(){ try { return JSON.parse(localStorage.getItem(LS_JOBNO_HIGH)||"{}")||{}; } catch(e){ return {}; } }
function mergeJobNoHigh(extra){
  const high = getJobNoHigh();
  const add = (prefix, n) => { if (!isNaN(n) && (!high[prefix] || n > high[prefix])) high[prefix] = n; };
  state.jobs.forEach(j => { const m = /^(WPS\d{4})(\d+)$/.exec(j.jobNo||""); if (m) add(m[1], parseInt(m[2],10)); });
  if (extra) Object.keys(extra).forEach(k => add(k, parseInt(extra[k],10)));
  try { localStorage.setItem(LS_JOBNO_HIGH, JSON.stringify(high)); } catch(e){}
  return high;
}
function saveJobs(){ mergeJobNoHigh(); localStorage.setItem(LS_JOBS, JSON.stringify(state.jobs)); markLocalChange(); }
function saveClients(){ localStorage.setItem(LS_CLIENTS, JSON.stringify(state.clients)); markLocalChange(); }

// ---------------------------------------------------------------- Google Sheet master copy
// The browser copy stays as the working/offline copy (the Photo Tool reads it too).
// Every change is pushed to the "WPS Job Log" Sheet on info@. On "Sync now" the newer copy wins,
// and a save never overwrites a Sheet that another device changed since we last synced.
const SHEET_JOB_COLS = [
  ["Job no","jobNo"],["Type","type"],["Status","status"],["Date","date"],["Time","time"],
  ["Address","address"],["Town","town"],["Postcode","postcode"],["Client","client"],
  ["Tenants","tenants"],["Tenant emails","tenantEmails"],["Tenant phones","tenantPhones"],["Agent email","agentEmail"],["Invoice","invoice"],["Invoice no","invoiceNo"],
  ["Photo link","photoLink"],["Notes","notes"],["ID","id"]
];
let cloudSaveTimer = null;
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function markLocalChange(){
  lsSet(LS_LOCAL_SAVED_AT, new Date().toISOString());
  if (!state.gcalConnected) return;
  // Ask for the Google token now, while we're still inside the click (pop-ups need a click).
  if (!(state.gcalToken && state.sheetsOk && Date.now() < state.gcalTokenExpiry - 60000)){
    ensureSheetsToken(function(){ scheduleCloudSave(); });
    return;
  }
  scheduleCloudSave();
}
function scheduleCloudSave(){
  clearTimeout(cloudSaveTimer);
  setCloud("saving");

function sheetsGranted(resp){

function ensureSheetsToken(onReady){

async function gapi(url, opts){

    headers: Object.assign({ "Authorization": "Bearer "+state.gcalToken, "Content-Type": "application/json" }, opts.headers||{})
  }));
  if (!res.ok){ const t = await res.text(); throw new Error(res.status+" "+t.slice(0,200)); }
  return res.status===204 ? null : res.json();
}
async function findOrCreateSheet(){

async function cloudSave(){
  if (!state.gcalToken){ setCloud("error","Google sign-in needed"); return; }
  try {
    const id = await findOrCreateSheet();
    const meta = await readCloudMeta(id);
    const synced = lsGet(LS_CLOUD_SYNCED_AT) || "";
    if (meta.savedAt && (!synced || meta.savedAt > synced)){
      // !synced = this device has never loaded the Sheet (e.g. a new phone): never overwrite it blind
      setCloud("conflict", synced ? "Changed on another device — click Sync now" : "Tap Sync now to load your jobs from Google");
      return;
    }
    const savedAt = new Date().toISOString();
    const base = "https://sheets.googleapis.com/v4/spreadsheets/"+id+"/values";
    await ensureContactsTab(id);
    await gapi(base+":batchClear", { method:"POST", body: JSON.stringify({ ranges:["Jobs!A:Z","Clients!A:Z","Contacts!A:Z","Meta!A:B"] }) });
    await gapi(base+":batchUpdate", { method:"POST", body: JSON.stringify({
      valueInputOption: "RAW",
      data: [
        { range:"Jobs!A1", values: jobsToRows() },
        { range:"Clients!A1", values: clientsToRows() },
        { range:"Contacts!A1", values: contactsToRows() },
        { range:"Meta!A1", values: [["savedAt", savedAt],["jobs", String(state.jobs.length)],["device", navigator.platform||""],["note","Written by the WPS Job Log. Edit jobs in the Job Log, not here."],["jobNoHigh", JSON.stringify(mergeJobNoHigh())]] }
      ]
    })});
    lsSet(LS_CLOUD_SYNCED_AT, savedAt);
    setCloud("saved");
  } catch(e){
    console.log("[WPS] cloud save failed", e);
    setCloud("error","Not saved to Google — will retry on next change");
  }
}
async function cloudLoad(id, meta){
  // Replace this browser's copy with the Sheet's (used by Sync now and by link actions). Returns false if cancelled.
  const hasContacts = await ensureContactsTab(id);
  const r = await gapi("https://sheets.googleapis.com/v4/spreadsheets/"+id+"/values:batchGet?ranges=Jobs!A:Z&ranges=Clients!A:Z&ranges=Contacts!A:Z");
  const parse = (vr) => {
    const rows = (vr && vr.values) || [];
    if (rows.length < 2) return [];
    const di = rows[0].indexOf("Data (do not edit)");
    return rows.slice(1).map(row => { try { return JSON.parse(row[di]); } catch(e){ return null; } }).filter(Boolean);
  };
  const jobs = parse(r.valueRanges[0]);
  const clients = normalizeClients(parse(r.valueRanges[1]));
  if (!jobs.length && state.jobs.length && !confirm("The Google copy has no jobs but this browser has "+state.jobs.length+". Load the empty Google copy anyway?")){ setCloud("error","Sync cancelled"); return false; }
  state.jobs = jobs; if (clients) state.clients = clients;
  const contacts = hasContacts ? normalizeContacts(parse(r.valueRanges[2])) : null;
  if (contacts && contacts.length) state.contacts = contacts;   // a Sheet without a Contacts tab keeps this browser's list
  fillContactsFromData();
  lsSet(LS_CONTACTS, JSON.stringify(state.contacts));
  try { mergeJobNoHigh(meta.jobNoHigh ? JSON.parse(meta.jobNoHigh) : null); } catch(e){ mergeJobNoHigh(); }
  localStorage.setItem(LS_JOBS, JSON.stringify(state.jobs));
  localStorage.setItem(LS_CLIENTS, JSON.stringify(state.clients));
  lsSet(LS_CLOUD_SYNCED_AT, meta.savedAt);
  lsSet(LS_LOCAL_SAVED_AT, meta.savedAt);
  return true;
}
async function cloudSyncNow(){
  // Called from the "Sync now" click: loads the Sheet if it's newer, otherwise pushes this browser's copy.
  setCloud("saving");   // show "Syncing…" straight away, while Google signs in
  ensureSheetsToken(async function(){
    setCloud("saving");
    try {
      const id = await findOrCreateSheet();
      const meta = await readCloudMeta(id);
      const localAt = lsGet(LS_LOCAL_SAVED_AT) || "";
      const synced = lsGet(LS_CLOUD_SYNCED_AT) || "";
      const cloudNewer = meta.savedAt && meta.savedAt > synced;
      const localChanged = localAt && localAt > synced && state.jobs.length > 0;
      if (cloudNewer && localChanged && !confirm("The Job Log was changed both here and on another device since the last sync.\n\nOK = load the Google copy (this browser's unsynced changes are lost)\nCancel = keep this browser's copy and overwrite Google")){
        lsSet(LS_CLOUD_SYNCED_AT, meta.savedAt); await cloudSave(); return;
      }
      if (cloudNewer){
        if (!(await cloudLoad(id, meta))) return;
        rememberGoogleConnected();
        setCloud("saved");
        render();
      } else {
        await cloudSave();
        rememberGoogleConnected();
        render();
      }
    } catch(e){
      console.log("[WPS] sync failed", e);
      setCloud("error","Sync failed — check connection");
    }
  });
}

// ---------------------------------------------------------------- helpers
function pad2(n){ return String(n).padStart(2,"0"); }
function uid(){ return 'job_' + Date.now() + '_' + Math.random().toString(36).slice(2,9); }

function nextJobNumber(dateStr){
  const d = dateStr ? new Date(dateStr) : new Date();
  const yy = pad2(d.getFullYear() % 100);
  const mm = pad2(d.getMonth()+1);
  const prefix = 'WPS' + yy + mm;
  const nums = state.jobs.map(j=>j.jobNo).filter(n=>n && n.startsWith(prefix))
    .map(n=>parseInt(n.slice(prefix.length),10)).filter(n=>!isNaN(n));
  const used = mergeJobNoHigh()[prefix] || 0;
  const next = Math.max(used, nums.length ? Math.max(...nums) : 0) + 1;
  return prefix + pad2(next);
}

function formatDate(s){
  if (!s) return "—";

  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});

function monthKey(s){ return s ? s.slice(0,7) : "undated"; }
function monthLabel(key){

// ---- report due / turnaround
function visitTime(j){
  if (!j.date) return null;
  const t = new Date(j.date+"T"+(j.time||"17:00")+":00");
  return isNaN(t) ? null : t;
}
function reportDue(j){
  if (!DUE_STATUSES.includes(j.status)) return null;
  const v = visitTime(j);
  const start = j.processingAt ? new Date(j.processingAt) : v;
  if (!start) return null;
  if (j.status==="booked" && (!v || v > new Date())) return null;   // visit hasn't happened yet
  const hrs = TURNAROUND_HOURS[j.type] || 48;
  return new Date(start.getTime() + hrs*3600000);
}
function dueInfo(j){
  const d = reportDue(j); if (!d) return null;
  const mins = Math.round((d - new Date())/60000);
  const fmt = m => { const a=Math.abs(m); return a>=1440 ? Math.round(a/1440)+"d" : a>=60 ? Math.round(a/60)+"h" : a+"m"; };
  // Still at Booked after the visit time: not counted as overdue until the visit is confirmed (12 Oct)
  if (j.status === "booked") return { cls:"due-soon", late:false, confirm:true, text:"Visit done? Move to Processing", due:d };
  if (mins < 0) return { cls:"due-late", late:true, text:"Report overdue "+fmt(mins), due:d };
  if (mins < 360) return { cls:"due-soon", late:false, text:"Report due in "+fmt(mins), due:d };
  return { cls:"due-ok", late:false, text:"Report due "+d.toLocaleString("en-GB",{weekday:"short",hour:"2-digit",minute:"2-digit"}), due:d };
}
function setJobStatus(j, code){
  j.status = code;
  if (code==="processing" && !j.processingAt) j.processingAt = new Date().toISOString();
  if (code==="booked") delete j.processingAt;
  // report sent date: starts the 7-day comment window and the turnaround score
  if (REPORT_OUT.includes(code) && !j.sentAt) j.sentAt = new Date().toISOString();
  if (!REPORT_OUT.includes(code)){ delete j.sentAt; delete j.reissuedAt; delete j.reissues; delete j.reminderAt; }
  if (code==="deemed" && !j.deemedAt) j.deemedAt = new Date().toISOString();
  if (code!=="deemed") delete j.deemedAt;
}
// ---------------------------------------------------------------- 7-day comment window (inventory & check-in)
// Window starts when the report is sent; a re-issue after amendments restarts it (changed items only).
// After 7 days with no open amendments the job moves to "Deemed agreed" by itself.
const COMMENT_DAYS = 7, REMINDER_DAYS_LEFT = 2;
function windowStart(j){ const s = j.reissuedAt || j.sentAt; return s ? new Date(s) : null; }
function windowClose(j){ const s = windowStart(j); return s ? addDays(s, COMMENT_DAYS) : null; }
function normJobNo(s){ return String(s||"").toUpperCase().replace(/\s+/g,""); }
function amendOpenFor(j){
  const a = state.amend; if (!a || !a.loaded) return null;          // unknown until the Amendments Sheet is read
  return a.jobs.some(g => normJobNo(g.job) === normJobNo(j.jobNo));
}
function autoReminder(j){
  // date text if the script already sent this window's 7-day reminder, else null
  const a = state.amend; if (!a || !a.autoRem) return null;
  const s = j.reissuedAt || j.sentAt; if (!s) return null;
  return a.autoRem[normJobNo(j.jobNo)+"|"+String(s).slice(0,10)] || null;
}
function windowState(j){
  // open | hold (amendments open, window passed) | due (passed, amendments not checked yet) | deemed | signed
  if (j.status==="signed") return "signed";
  if (j.status==="deemed") return "deemed";
  const c = windowClose(j); if (!c) return null;
  if (c > new Date()) return "open";
  const open = amendOpenFor(j);
  if (open === true) return "hold";
  return "due";
}
function autoDeem(){
  // Only runs once the Amendments Sheet has been read, so a job with open comments is never deemed agreed.
  if (!state.amend || !state.amend.loaded) return 0;
  let n = 0;
  state.jobs.forEach(j => {
    if (j.type!=="ICI" || j.status!=="sent") return;
    const c = windowClose(j); if (!c || c > new Date()) return;
    if (amendOpenFor(j)) return;
    j.status = "deemed"; j.deemedAt = c.toISOString(); n++;
  });
  if (n){ saveJobs(); console.log("[WPS] deemed agreed:", n); }
  return n;
}
function reissueJob(id){
  // Report re-issued after amendments: restart the 7-day window from now (changed items only).
  captureFormValues();
  const now = new Date().toISOString();
  const apply = j => { if (!j) return; j.reissuedAt = now; j.reissues = (j.reissues||0) + 1; j.status = "sent"; if (!j.sentAt) j.sentAt = now; delete j.deemedAt; delete j.reminderAt; };
  apply(state.jobs.find(x=>x.id===id));
  apply(state.editing);
  saveJobs();
  render();
}
function cleanEmails(v){
  // tidy a typed/pasted list: split on commas, semicolons or spaces, keep what looks like an email
  return String(v||"").split(/[,;\s]+/).map(x=>x.trim().replace(/^<|>$/g,"")).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)).join(", ");
}
// ---------------------------------------------------------------- tenants as separate rows (13 Oct, tracker item 27)
// Each job keeps tenantList = [{name, phone, email}]. The old text fields are still filled from it, because the
// calendar, dashboard, Sheet columns and the process emails (Apps Script reads tenantEmails) all use them:
//   tenants      = "Name phone; Name phone"   tenantEmails = "a@x.com, b@y.com"
// If another device or the link action changed the text fields, the rows are rebuilt from them.
const MAX_TENANTS = 6;
const EMAIL_RE_G = /[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/g;
const TPHONE_RE_G = /(?:\+\d{1,3}[\s-]?|\b0)\d(?:[\s-]?\d){8,11}\b/g;
function tenantsText(list){
  return (list||[]).map(t => [t.name, t.phone].map(s=>String(s||"").trim()).filter(Boolean).join(" ")).filter(Boolean).join("; ");
}
function tenantEmailsText(list){ return cleanEmails((list||[]).map(t=>t.email||"").join(", ")); }
function tenantPhonesText(list){ return (list||[]).map(t=>String(t.phone||"").trim()).filter(Boolean).join(", "); }
function splitTenants(text){
  // Free text such as "Ms Jo Bloggs - 07700 900000 | jo@x.com & Sam Lee 07700 900001 sam@y.com" or
  // "Lily Stevens, Omar Radwan, <omar@x.com>" -> rows in the order they appear. A name starts a new row
  // once the current row has a name; a phone or email starts one if the current row already has that field.
  const s = String(text||"");
  const marks = [];
  s.replace(EMAIL_RE_G, (m, i) => { marks.push({ i, end:i+m.length, kind:"email", v:m }); return m; });
  s.replace(TPHONE_RE_G, (m, i) => { if (!marks.some(k => i < k.end && i+m.length > k.i)) marks.push({ i, end:i+m.length, kind:"phone", v:m.trim() }); return m; });
  marks.sort((a,b)=>a.i-b.i);
  const tokens = [];
  let pos = 0;
  const pushNames = chunk => chunk.split(/[,;|&\/\n]+|\s+and\s+|\s+-\s+|\s{3,}/i).forEach(part => {
    const n = part.replace(/[<>()\[\]"':]/g," ").replace(/\s+/g," ").trim();
    if (/[A-Za-z]{2,}/.test(n)) tokens.push({ kind:"name", v:n });
  });
  marks.forEach(m => { pushNames(s.slice(pos, m.i)); tokens.push(m); pos = m.end; });
  pushNames(s.slice(pos));
  const rows = [];
  let cur = null;
  tokens.forEach(t => {
    if (!cur || cur[t.kind]) { cur = { name:"", phone:"", email:"" }; rows.push(cur); }
    cur[t.kind] = t.v;
  });
  return rows;
}
function addEmailsToRows(rows, emailsText){
  // put each email not already on a row into the first row without an email, else a new row
  const have = rows.map(r => (r.email||"").toLowerCase());
  cleanEmails(emailsText).split(", ").filter(Boolean).forEach(e => {
    if (have.indexOf(e.toLowerCase()) !== -1) return;
    const free = rows.find(r => !r.email);
    if (free) free.email = e; else rows.push({ name:"", phone:"", email:e });
    have.push(e.toLowerCase());
  });
  return rows;
}
function tenantRowsFor(j){
  const list = Array.isArray(j.tenantList) ? j.tenantList.map(t => ({ name:t.name||"", phone:t.phone||"", email:t.email||"" })) : null;
  if (list && tenantsText(list) === String(j.tenants||"").trim()){
    // rows still match the text: only bring the emails in line (the link action may have changed them)
    const want = cleanEmails(j.tenantEmails).toLowerCase().split(", ").filter(Boolean);
    list.forEach(r => { if (r.email && want.indexOf(r.email.toLowerCase()) === -1) r.email = ""; });
    return addEmailsToRows(list, j.tenantEmails).filter(r => r.name || r.phone || r.email);
  }
  return addEmailsToRows(splitTenants(j.tenants), j.tenantEmails);
}
function tenantsNeedCheck(j){
  // true when the rows were worked out from old free text (shown to Lex until he saves)
  return !!String(j.tenants||"").trim() && !(Array.isArray(j.tenantList) && tenantsText(j.tenantList) === String(j.tenants||"").trim());
}

// ---------------------------------------------------------------- quick extract (offline, regex-based)
const UK_POSTCODE = /([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})/i;

function quickExtract(raw){
  const postcodeLineMatch = raw.split("\n").find(l => UK_POSTCODE.test(l));
  let street = "", town = "", postcode = "";
  if (postcodeLineMatch){
    const pcMatch = postcodeLineMatch.match(UK_POSTCODE);
    postcode = (pcMatch[1] + " " + pcMatch[2]).toUpperCase();
    const rest = postcodeLineMatch.replace(pcMatch[0], "").split(",").map(s=>s.trim()).filter(Boolean);
    if (rest.length===1){ street = rest[0]; }
    else if (rest.length>1){ town = rest[rest.length-1]; street = rest.slice(0,-1).join(", "); }
  }
  let dateIso = "";
  const dmY = raw.match(/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})\b/);
  if (dmY){
    let [,d,m,y] = dmY;
    if (y.length===2) y = "20"+y;
    dateIso = y+"-"+pad2(m)+"-"+pad2(d);
  }
  let type = "ICI";
  const low = raw.toLowerCase();
  if (low.includes("mid-term") || low.includes("mid term") || low.includes("interim")) type = "MTI";
  else if (low.includes("check-out") || low.includes("check out") || low.includes("checkout")) type = "CO";
  else if (low.includes("schedule of condition")) type = "SOC";
  else if (low.includes("clean")) type = "CLN";
  else if (low.includes("check-in") || low.includes("check in") || low.includes("checkin") || low.includes("inventory")) type = "ICI";

  return { type, date: dateIso, address: street, town, postcode };
}

function runExtract(){
  const raw = document.getElementById("extractRaw").value;
  if (!raw.trim()) return;
  captureFormValues();
  const found = quickExtract(raw);

    date: found.date || state.editing.date,
    address: found.address || state.editing.address,

  });

}

  const merged = Object.assign({}, prev, job);   // keeps photo link, calendar id, dates etc.

// ---------------------------------------------------------------- rearrange a missed visit (13 Oct)
// Reports due rows (Booked past their date, or Processing) get a Rearrange button for visits that didn't
// happen. New date known: job back to Booked on the new date, calendar event moved, confirmation email.
// Not known: date and time cleared so it shows in Times to agree, calendar event removed, email asking
// for a new date. A note goes on the job either way. Emails open in Gmail; nothing is sent from here.
const RR_TYPE_WORDS = { ICI:"check-in", CO:"check-out", MTI:"mid-term inspection", SOC:"schedule of condition", CLN:"clean check" };
const RR_MIDTERM_CC = "bowpropman@winkworth.co.uk";
function rrLongDay(iso){ return iso ? new Date(iso+"T00:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}) : ""; }
function rrShortDay(iso){ return iso ? new Date(iso+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}).replace(",","") : ""; }
function rrTenantNames(j){
  const n = (j.tenantList||[]).map(t => (t.name||"").trim()).filter(Boolean);
  if (!n.length) return "Tenants";
  return n.length === 1 ? n[0] : n.slice(0,-1).join(", ")+" and "+n[n.length-1];

function rearrangeEmailUrl(j, kind, missedIso){
  const tm = typeMeta(j.type), word = RR_TYPE_WORDS[j.type] || tm.label.toLowerCase();
  const addr = fullAddress(j) || "[full address]", mid = j.type === "MTI";

      + "If anything changes, reply to this email or call or WhatsApp 07541 345053.\n\nKind regards,";
  } else {
    su = tm.label+" - "+addr+" - new date needed";
    body = "Dear "+rrTenantNames(j)+",\n\nWe were unable to carry out the "+word+" at\n\n"+addr+"\n\n"+(missedIso ? "on "+rrLongDay(missedIso)+", so we" : "so we")+" need to arrange a new date.\n\n"
      + "Please reply with a few days and times that suit you over the next two weeks.\n\n"
      + (mid ? "The inspection usually takes less than 15 minutes. If you would rather not be present, let us know and we can arrange access in advance.\n\n" : "")
      + "If you have any questions, reply to this email or call or WhatsApp 07541 345053.\n\nKind regards,";

    + (mid ? "&cc="+encodeURIComponent(RR_MIDTERM_CC) : "")

function rearrangeBox(j){

function openRearrange(id){ state.rearrangeId = (state.rearrangeId === id) ? null : id; render(); const b = document.getElementById("rr_box"); if (b && b.scrollIntoView) b.scrollIntoView({block:"nearest"}); }
function closeRearrange(){ state.rearrangeId = null; render(); }
function saveRearrange(id){
  const j = state.jobs.find(x=>x.id===id); if (!j) return;
  const newDate = (document.getElementById("rr_date")||{}).value || "";
  const newTime = (document.getElementById("rr_time")||{}).value || "";
  const wantEmail = !!(document.getElementById("rr_email")||{}).checked;
  if (newTime && !newDate){ alert("Add the new date as well as the time, or clear the time."); return; }
  if (newDate && newDate < isoToday(0)){ alert("The new date is in the past. Pick today or later."); return; }
  const missedIso = j.date || "", missedTxt = missedIso ? rrShortDay(missedIso)+(j.time ? " "+j.time : "") : "no date";
  const today = new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  const line = "Rearranged "+today+": visit "+missedTxt+" didn't happen. "+(newDate ? "New date "+rrShortDay(newDate)+(newTime ? " "+newTime : "")+"." : "New date to agree.");
  j.notes = j.notes ? line+"\n"+j.notes : line;
  j.rearranges = (j.rearranges||[]).concat([{ at:new Date().toISOString(), missedDate:missedIso, missedTime:j.time||"", newDate, newTime }]);
  setJobStatus(j, "booked");
  j.date = newDate; j.time = newTime;
  let calMsg = "";
  if (newDate){
    delete j.rearrangePending;
    if (state.gcalConnected) syncJobToCalendar(j); else calMsg = " Calendar not connected, so the event wasn't moved.";
  } else {
    j.rearrangePending = true;
    if (state.gcalConnected && j.gcalEventId){
      // Keep the event id until Google confirms the delete, so a failure can be retried.
      deleteJobCalendarEvent({ gcalEventId: j.gcalEventId, jobNo: j.jobNo }, function(ok){ if (ok && j.gcalEventId){ delete j.gcalEventId; saveJobs(); } });
    }
    else if (j.gcalEventId) calMsg = " Calendar not connected, so the missed date is still on it.";
  }
  saveJobs();
  state.rearrangeId = null;
  if (wantEmail) window.open(rearrangeEmailUrl(j, newDate ? "confirm" : "ask", missedIso), "_blank", "noopener");
  render();
  showActionBar((j.jobNo||"Job")+(newDate ? " rearranged to "+rrShortDay(newDate)+(newTime ? " "+newTime : "") : " moved to Times to agree")+"."+calMsg);
}

  const before = snapJob(j);
  setTimeout(() => showUndo(`${j.jobNo || "Job"} invoice: ${invoiceMeta(j.invoice).label}`, before), 0);
  const now = new Date().toISOString();
  if (!j.invoice){ j.invoice = "invoiced"; j.invoicedAt = now; }
  else if (j.invoice==="invoiced"){ j.invoice = "paid"; j.paidAt = now; }
  else { j.invoice = ""; delete j.paidAt; delete j.invoicedAt; }
  saveJobs();
  render();
}

function setStatusFilter(code){
  state.statusFilter = (state.statusFilter===code) ? "all" : code;
  render();
}

// ---------------------------------------------------------------- export / import
function exportData(){
  const payload = { exportedAt: new Date().toISOString(), jobs: state.jobs, clients: state.clients };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "WPS-Job-Log-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importData(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.jobs)) throw new Error("bad shape");
      if (!confirm("Import " + data.jobs.length + " job(s)? This will replace your current data in this browser.")) return;
      state.jobs = data.jobs;
      const norm = normalizeClients(data.clients);
      if (norm) state.clients = norm;
      saveJobs(); saveClients();
      render();
    } catch(e){ alert("Couldn't read that file — is it a Job Log backup .json?"); }
  };
  reader.readAsText(file);
}

// ---------------------------------------------------------------- Google Calendar sync
function initGCal(){
  if (!window.google || !google.accounts || !google.accounts.oauth2) return;
  gcalTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GCAL_SCOPE + " " + GMAIL_SCOPE + " " + SHEETS_SCOPE + " " + AMEND_SCOPE,
    callback: function(){},
    // Google pop-up closed or blocked: don't leave "Syncing…" showing forever
    error_callback: function(err){
      if (state.cloudStatus === "saving") setCloud("error", (err && err.type === "popup_failed_to_open") ? "Google sign-in pop-up was blocked — allow pop-ups and tap Sync again" : "Google sign-in was closed — tap Sync again");
    }
  });
}
function connectGCal(){
  if (!gcalTokenClient){ alert("Google sign-in hasn't loaded yet — check your connection and try again."); return; }
  gcalTokenClient.callback = function(resp){
    if (resp.error){ alert("Couldn't connect to Google Calendar."); return; }
    state.gcalToken = resp.access_token;
    state.gcalTokenExpiry = Date.now() + (resp.expires_in*1000);
    state.gmailOk = gmailGranted(resp); state.sheetsOk = sheetsGranted(resp);
    state.gcalConnected = true;
    try{ localStorage.setItem(LS_GCAL_PREF, "1"); }catch(e){}
    render();
  };
  gcalTokenClient.requestAccessToken({ prompt: "consent" });
}
function disconnectGCal(){
  state.gcalConnected = false;
  state.gcalToken = null;
  state.gcalTokenExpiry = 0;
  try{ localStorage.removeItem(LS_GCAL_PREF); }catch(e){}
  render();
}
function ensureGCalToken(onReady){
  if (state.gcalToken && Date.now() < state.gcalTokenExpiry - 60000){ onReady(); return; }
  if (!gcalTokenClient){ alert("Google sign-in hasn't loaded yet — check your connection and try again."); return; }
  gcalTokenClient.callback = function(resp){
    if (resp.error){ alert('Google Calendar needs reconnecting — click "Connect Google Calendar" again.'); return; }
    state.gcalToken = resp.access_token;
    state.gcalTokenExpiry = Date.now() + (resp.expires_in*1000);
    state.gmailOk = gmailGranted(resp); state.sheetsOk = sheetsGranted(resp);
    onReady();
  };
  gcalTokenClient.requestAccessToken({ prompt: "" });
}
function gcalEventSummary(j){
  const tm = typeMeta(j.type);
  return [j.jobNo, tm.code, fullAddress(j)].filter(Boolean).join(" - ");
}
function gcalEventBody(j){
  const tz = "Europe/London";
  let start, end;
  if (j.date && j.time){
    start = { dateTime: j.date+"T"+j.time+":00", timeZone: tz };
    const parts = j.time.split(":").map(Number);
    let eh = parts[0]+1, em = parts[1];
    if (eh>23){ eh=23; em=59; }
    end = { dateTime: j.date+"T"+pad2(eh)+":"+pad2(em)+":00", timeZone: tz };
  } else if (j.date){
    start = { date: j.date };
    // all-day events: Google's end date is exclusive, so it must be the day after
    const nd = new Date(j.date+"T00:00:00Z"); nd.setUTCDate(nd.getUTCDate()+1);
    end = { date: nd.toISOString().slice(0,10) };
  } else {
    return null;
  }
  const descParts = [];
  if (j.client) descParts.push("Agent: "+j.client);
  if (j.tenants) descParts.push("Tenant/contact: "+j.tenants);
  if (j.tenantEmails) descParts.push("Tenant emails: "+j.tenantEmails);
  if (j.agentEmail) descParts.push("Copy to: "+j.agentEmail);
  if (j.notes) descParts.push("Notes: "+j.notes);
  return { summary: gcalEventSummary(j), location: fullAddress(j), description: descParts.join("\n"), start, end };
}
function syncJobToCalendar(job){
  if (!state.gcalConnected || !job) return;
  const body = gcalEventBody(job);
  if (!body){ alert("Add a date before syncing this job to the calendar."); return; }
  ensureGCalToken(function(){
    const base = "https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(GCAL_CALENDAR_ID)+"/events";
    const isUpdate = !!job.gcalEventId;
    const url = isUpdate ? base+"/"+job.gcalEventId : base;
    fetch(url, {
      method: isUpdate ? "PATCH" : "POST",
      headers: { "Authorization": "Bearer "+state.gcalToken, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function(r){
      if (!r.ok){ throw new Error("Calendar API error "+r.status); }
      return r.json();
    }).then(function(data){
      if (data.id && job.gcalEventId !== data.id){
        job.gcalEventId = data.id;
        saveJobs();
        render();
      }
    }).catch(function(err){
      console.error("Calendar sync failed", err);
      alert("Couldn't sync this job to Google Calendar. Try again in a moment.");
    });
  });
}
// Removes a job's calendar event. Google's answer is checked (13 Oct): 404/410 means it was already gone.
// On any other failure a message says so, so a missed visit doesn't silently stay on the calendar.
function deleteJobCalendarEvent(job, onDone){
  if (!state.gcalConnected || !job || !job.gcalEventId){ if (onDone) onDone(false); return; }
  const label = job.jobNo || "this job";
  const fail = function(why){
    console.error("Calendar delete failed", label, job.gcalEventId, why);
    showActionBar("Couldn't remove the calendar event for "+label+" ("+why+"). Delete it in Google Calendar by hand.");
    if (onDone) onDone(false);
  };
  ensureGCalToken(function(){
    fetch("https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(GCAL_CALENDAR_ID)+"/events/"+job.gcalEventId, {
      method: "DELETE",
      headers: { "Authorization": "Bearer "+state.gcalToken }
    }).then(function(r){
      if (r.ok || r.status === 404 || r.status === 410){ if (onDone) onDone(true); }
      else fail("Google said "+r.status);
    }).catch(function(err){ fail(String(err && err.message || err)); });
  });
}

// ---------------------------------------------------------------- booking review tray (reads Claude's queue drafts from Gmail)
/*
  Claude's scheduled inbox check writes Gmail drafts titled "WPS Job Log Queue …"
  in info@. Each draft carries a wps-queue.json attachment:
    { "version":1, "generatedAt":"ISO", "items":[ {id, kind:"new"|"update"|"cancel", type, client,
      date:"YYYY-MM-DD", time:"HH:MM", address, town, postcode, tenants, notes, summary,
      sourceFrom, sourceSubject, sourceDate, sourceUrl} ] }
  Nothing here writes to Gmail — approving/rejecting is remembered in this browser.
*/
function gmailGranted(resp){
  try { return google.accounts.oauth2.hasGrantedAllScopes(resp, GMAIL_SCOPE); } catch(e){ return false; }
}
function ensureGmailToken(onReady){
  if (state.gcalToken && state.gmailOk && Date.now() < state.gcalTokenExpiry - 60000){ onReady(); return; }
  if (!gcalTokenClient){ initGCal(); }
  if (!gcalTokenClient){ state.queueBusy=false; state.queueMsg="Google sign-in hasn't loaded yet — check your connection and try again."; render(); return; }
  gcalTokenClient.callback = function(resp){
    if (resp.error){ state.queueBusy=false; state.queueMsg="Google sign-in was cancelled."; render(); return; }
    state.gcalToken = resp.access_token;
    state.gcalTokenExpiry = Date.now() + (resp.expires_in*1000);
    state.gmailOk = gmailGranted(resp); state.sheetsOk = sheetsGranted(resp);
    if (!state.gcalConnected && google.accounts.oauth2.hasGrantedAllScopes(resp, GCAL_SCOPE)){
      state.gcalConnected = true; try{ localStorage.setItem(LS_GCAL_PREF, "1"); }catch(e){}
    }
    if (!state.gmailOk){
      state.queueBusy=false;
      state.queueMsg='Gmail access wasn\'t ticked. Click "Check for new bookings" again and allow "View your email messages" (read-only).';
      render(); return;
    }
    onReady();
  };
  // first time (or scope missing) needs the consent screen; after that it's silent
  gcalTokenClient.requestAccessToken({ prompt: state.gmailOk ? "" : "consent" });
}
function b64ToText(s){
  s = String(s||"").replace(/\s+/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
async function gmailGet(path){
  const r = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/"+path, { headers:{ "Authorization":"Bearer "+state.gcalToken } });
  if (!r.ok){ const e = new Error("Gmail API "+r.status); e.status = r.status; throw e; }
  return r.json();
}
function walkParts(part, out){
  if (!part) return out;
  out.push(part);
  (part.parts||[]).forEach(p=>walkParts(p,out));
  return out;
}
async function readQueuePayload(draftId){
  const dr = await gmailGet("drafts/"+draftId+"?format=full");
  const msg = dr.message || {};
  const parts = walkParts(msg.payload, []);
  // 1) the JSON attachment
  const att = parts.find(p => /\.json$/i.test(p.filename||"") || /application\/json/i.test(p.mimeType||""));
  if (att){
    let data = att.body && att.body.data;
    if (!data && att.body && att.body.attachmentId){
      const a = await gmailGet("messages/"+msg.id+"/attachments/"+att.body.attachmentId);
      data = a.data;
    }
    if (data) return JSON.parse(b64ToText(data));
  }
  // 2) fallback: base64 block between markers in the plain-text body
  const txtPart = parts.find(p => /text\/plain/i.test(p.mimeType||"") && p.body && p.body.data);
  if (txtPart){
    const txt = b64ToText(txtPart.body.data);
    const m = txt.match(/===WPS-QUEUE-BEGIN===([\s\S]*?)===WPS-QUEUE-END===/);
    if (m){
      const block = m[1].replace(/\r/g,"").trim();
      if (block.startsWith("{")){
        try { return JSON.parse(block); } catch(e){}
        // tolerate soft line-wrapping added by some mail paths
        return JSON.parse(block.replace(/\n(?!\s*[{\]"])/g, ""));
      }
      return JSON.parse(b64ToText(block));
    }
  }
  return null;
}
function checkForBookings(){
  state.queueBusy = true; state.queueMsg = ""; render();
  ensureGmailToken(async function(){
    try{
      const list = await gmailGet("drafts?maxResults=50&q="+encodeURIComponent('subject:"'+QUEUE_SUBJECT+'"'));
      const drafts = list.drafts || [];
      const byId = {};
      const payloads = [];
      for (const d of drafts){
        try{ const p = await readQueuePayload(d.id); if (p && Array.isArray(p.items)) payloads.push(p); }
        catch(e){ console.warn("Skipped a queue draft", d.id, e); }
      }
      payloads.sort((a,b)=>String(a.generatedAt||"").localeCompare(String(b.generatedAt||"")));
      payloads.forEach(p=>p.items.forEach(it=>{ if (it && it.id) byId[it.id] = Object.assign({ generatedAt:p.generatedAt }, it); }));
      state.queue = Object.values(byId).sort((a,b)=>String(a.date||"9999").localeCompare(String(b.date||"9999")));
      state.queueChecked = true;
      state.queueCheckedAt = new Date();
      if (!drafts.length) state.queueMsg = "No queue from Claude in your drafts yet.";
    } catch(e){
      console.error(e);
      state.queueMsg = (e.status===403)
        ? "Google refused Gmail access (403). The Gmail API probably isn't switched on in the wps-job-log Google Cloud project yet."
        : (e.status===401 ? "Google sign-in expired — click Check for new bookings again." : "Couldn't read the booking queue: "+e.message);
      if (e.status===401){ state.gcalToken=null; }
    } finally {
      state.queueBusy = false; render();
    }
  });
}
function pendingQueue(){ return state.queue.filter(i=>!state.queueDone[i.id]); }
function markQueueDone(id, how){
  state.queueDone[id] = { how, at: new Date().toISOString() };
  try{ localStorage.setItem(LS_QUEUE_DONE, JSON.stringify(state.queueDone)); }catch(e){}
}
function queueItem(id){ return state.queue.find(i=>i.id===id); }
function emailLink(it){
  let u = it.sourceUrl || "";
  // Gmail wraps links saved in drafts in a google.com/url redirect — unwrap it
  const m = u.match(/^https:\/\/www\.google\.com\/url\?q=([^&]+)/);
  if (m){ try { u = decodeURIComponent(m[1]); } catch(e){} }
  if (!u && it.id){ u = "https://mail.google.com/mail/?authuser=info@wellingtonparker.com#all/" + String(it.id).split("-")[0]; }
  return u;
}
function normPc(s){ return String(s||"").toUpperCase().replace(/\s+/g,""); }
function firstNum(s){ const m = String(s||"").match(/\d+[A-Za-z]?/); return m ? m[0].toLowerCase() : ""; }
function daysApart(a,b){ if(!a||!b) return 999; return Math.abs((new Date(a)-new Date(b))/86400000); }
function sameProperty(job, it){
  if (!it.postcode || normPc(job.postcode)!==normPc(it.postcode)) return false;
  const n = firstNum(it.address);
  return !n || firstNum(job.address)===n || String(job.address||"").toLowerCase().includes(n);
}
function findMatch(it){
  const cands = state.jobs.filter(j=>sameProperty(j,it) && j.status!=="archived" && (!it.type || j.type===it.type));
  if (!cands.length) return null;
  const ref = it.date || new Date().toISOString().slice(0,10);
  return cands.sort((a,b)=>daysApart(a.date,ref)-daysApart(b.date,ref))[0];
}
function findDuplicate(it){
  return state.jobs.find(j=>sameProperty(j,it) && j.type===it.type && daysApart(j.date,it.date)<=3) || null;
}
function resolveClientName(name){
  if (!name) return "";
  const low = name.toLowerCase().replace(/[^a-z]/g,"");
  const hit = state.clients.find(c=>c.name.toLowerCase().replace(/[^a-z]/g,"")===low)
           || state.clients.find(c=>{ const k=c.name.toLowerCase().replace(/[^a-z]/g,""); return k && (k.includes(low)||low.includes(k)); });
  if (hit) return hit.name;
  state.clients.push({ name, contactName:"", contactPhone:"", contactEmail:"" });
  saveClients();
  return name;
}
function jobFromItem(it){
  const j = emptyJob();
  const src = it.sourceSubject ? "From email: "+it.sourceSubject+(it.sourceDate ? " ("+it.sourceDate+")" : "") : "";
  Object.assign(j, {
    type: TYPES.some(t=>t.code===it.type) ? it.type : "ICI",
    client: resolveClientName(it.client),
    date: it.date||"", time: it.time||"",
    address: it.address||"", town: it.town||"", postcode: it.postcode||"",
    tenants: it.tenants||"",
    notes: [it.notes, src].filter(Boolean).join("\n"),
  });
  return j;
}
function qAdd(id){
  const it = queueItem(id); if (!it) return;
  const dup = findDuplicate(it);
  if (dup && !confirm("Looks like this is already logged as "+dup.jobNo+" ("+formatDate(dup.date)+"). Add it anyway?")) return;
  const job = jobFromItem(it);
  job.jobNo = nextJobNumber(job.date);
  state.jobs.push(job); saveJobs();
  markQueueDone(id,"added");
  render();
  syncJobToCalendar(job);
}
function qEdit(id){
  const it = queueItem(id); if (!it) return;
  if (it.kind!=="new"){
    const m = findMatch(it);
    if (m){
      state.editing = Object.assign({}, m, {
        date: it.date || m.date, time: it.time || m.time,
        tenants: m.tenants || it.tenants || "",
        notes: [m.notes, it.summary ? "Update from email: "+it.summary : ""].filter(Boolean).join("\n"),
      });
      state.fromQueueId = id; state.addingClient=false; state.editingAgentContact=false;
      render(); scrollToForm(); return;
    }
  }
  state.editing = jobFromItem(it);
  state.fromQueueId = id; state.addingClient=false; state.editingAgentContact=false;
  render(); scrollToForm();
}
function qApplyUpdate(id){
  const it = queueItem(id); const m = it && findMatch(it); if (!m) return;
  if (it.date) m.date = it.date;
  if (it.time) m.time = it.time;
  if (it.tenants && !m.tenants) m.tenants = it.tenants;
  if (it.summary) m.notes = [m.notes, "Update from email: "+it.summary].filter(Boolean).join("\n");
  saveJobs(); markQueueDone(id,"updated"); render();
  syncJobToCalendar(m);
}
function qApplyCancel(id){
  const it = queueItem(id); const m = it && findMatch(it); if (!m) return;
  if (!confirm("Delete "+m.jobNo+" ("+(m.address||"")+")? It's cancelled, so it will be removed from the Job Log and the calendar. This can't be undone.")) return;
  deleteJobCalendarEvent(m);
  mergeJobNoHigh();   // remember its number so it's never reused
  state.jobs = state.jobs.filter(j => j.id !== m.id);
  saveJobs(); markQueueDone(id,"cancelled"); render();
}
function qReject(id){ markQueueDone(id,"rejected"); render(); }
function qCloseTray(){ state.queueChecked=false; state.queueMsg=""; render(); }

function renderQueueTray(){
  if (!state.queueChecked && !state.queueBusy && !state.queueMsg) return "";
  const items = pendingQueue();
  const when = state.queueCheckedAt ? state.queueCheckedAt.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : "";
  const KIND = { new:["New booking","qk-new"], update:["Change to a booking","qk-update"], cancel:["Cancellation","qk-cancel"] };
  const cards = items.map(it=>{
    const k = KIND[it.kind] || KIND.new;
    const tm = typeMeta(it.type);
    const addr = [it.address,it.town,it.postcode].filter(Boolean).join(", ");
    const match = it.kind!=="new" ? findMatch(it) : null;
    const dup = it.kind==="new" ? findDuplicate(it) : null;
    let warn = "";
    if (it.kind!=="new" && match) warn = `<div class="qline">Matches <span class="mono">${esc(match.jobNo)}</span> — currently ${formatDate(match.date)}${match.time?" at "+esc(match.time):""}</div>`;
    if (it.kind!=="new" && !match) warn = `<div class="qwarn">Couldn't find this job in your log — use "Edit & add" if it should be logged.</div>`;
    if (dup) warn = `<div class="qwarn">Possible duplicate of <span class="mono">${esc(dup.jobNo)}</span> (${formatDate(dup.date)}).</div>`;
    let actions = "";
    if (it.kind==="new" || !match){
      actions = `<button class="btn btn-coral btn-sm" onclick="qAdd('${esc(it.id)}')"${hint("Adds it as a new job straight away")}>Add to log</button>
                 <button class="btn btn-ghost btn-sm" onclick="qEdit('${esc(it.id)}')"${hint("Opens it in the form to check before saving")}>Edit &amp; add</button>`;
    } else if (it.kind==="update"){
      actions = `<button class="btn btn-coral btn-sm" onclick="qApplyUpdate('${esc(it.id)}')"${hint("Changes the date and time on the matching job")}>Apply change</button>
                 <button class="btn btn-ghost btn-sm" onclick="qEdit('${esc(it.id)}')"${hint("Opens the matching job with the change filled in, to check first")}>Edit first</button>`;
    } else {
      actions = `<button class="btn btn-coral btn-sm" onclick="qApplyCancel('${esc(it.id)}')"${hint("Removes the matching job and its calendar entry (asks first)")}>Delete cancelled job</button>`;
    }
    actions += `<button class="btn btn-text btn-sm" onclick="qReject('${esc(it.id)}')"${hint("Ignore it. Nothing in the log changes.")}>Dismiss</button>`;
    return `<div class="qcard">
      <div class="qtop"><span class="qkind ${k[1]}">${k[0]}</span><span class="type-badge">${esc(tm.label)}</span><span>${esc(it.client)||"Client not clear"}</span></div>
      <div class="qaddr">${esc(addr)||"Address not clear"}</div>
      <div class="qmeta">${it.date ? formatDate(it.date) : "No date yet"}${it.time ? " · "+esc(it.time) : (it.date ? " · time TBC" : "")}</div>
      ${it.tenants ? `<div class="qline">Contact: ${esc(it.tenants)}</div>` : ""}
      ${it.notes ? `<div class="qline">Notes: ${esc(it.notes)}</div>` : ""}
      ${it.summary ? `<div class="qwhy">${esc(it.summary)}</div>` : ""}
      ${warn}
      <div class="qsrc">${esc(it.sourceFrom||"")}${it.sourceSubject ? " — "+esc(it.sourceSubject) : ""}${emailLink(it) ? ` · <a href="${esc(emailLink(it))}" target="_blank" rel="noopener">Open email</a>` : ""}</div>
      <div class="qactions">${actions}</div>
    </div>`;
  }).join("");
  return `<div class="tray">
    <div class="tray-head">
      <div>
        <h3>To review${items.length ? " ("+items.length+")" : ""}</h3>
        <div class="tray-sub">${state.queueBusy ? "Checking Gmail…" : ("Bookings Claude found in your inbox"+(when ? " · checked "+when : ""))}</div>
      </div>
      <button class="btn btn-text btn-sm" onclick="qCloseTray()"${tip("Hide this tray. Anything not handled shows again next check.")}>Hide</button>
    </div>
    ${helpBox(`Each card is an email Claude read as a <b>new booking</b>, a <b>change</b> or a <b>cancellation</b>. Check it against the email (Open email), then use the buttons. Nothing goes in the log until you click.`)}
    ${state.queueMsg ? `<div class="qwarn" style="margin-top:10px;">${esc(state.queueMsg)}</div>` : ""}
    ${!state.queueBusy && state.queueChecked && !items.length && !state.queueMsg ? `<div class="qline" style="margin-top:10px;">Nothing new to review ✓</div>` : ""}
    ${cards}
  </div>`;
}

// ---------------------------------------------------------------- rendering
function render(){
  const app = document.getElementById("app");
  document.body.classList.toggle("help-on", !!state.helpOn);
  app.innerHTML = `
    <div class="shell">
    ${renderSidebar()}
    <main class="main">
    <div class="wrap${state.view === "today" ? " wrap-dash" : ""}">
      ${renderPageHead()}
      ${renderUrlAction()}
      ${state.view === "today" ? "" : helpBox(`The cards count jobs at each stage. <b>Click a card</b> to show only those jobs, click it again to show all. In each row, <b>click the stage pill</b> to move the job on one step, <b>click the invoice pill</b> for Not invoiced → Invoiced → Paid, and use the <b>pencil</b> to open the job. Rows in red are overdue.`) + renderStatusStrip()}
      ${renderQueueTray()}

      const rows = r.values || [];

      const byJob = {};

      const autoRem = {};

        const pr = await gapi("https://sheets.googleapis.com/v4/spreadsheets/"+AMEND_SHEET_ID+"/values/"+encodeURIComponent("'Process emails'!A:G")+"?valueRenderOption=UNFORMATTED_VALUE");

        prow.slice(1).forEach(r => { if (r[pE]==="D" && r[pS]==="Sent") autoRem[normJobNo(r[pJ])+"|"+String(r[pW]||"").replace(/^'/,"")] = (typeof r[pT]==="number") ? new Date(Math.round((r[pT]-25569)*86400000)) : new Date(); });
      } catch(e){ console.log("[WPS] process emails read failed", e); }

    case "inv": title = "To invoice"; body = rows(toInvoice, j => cRow(j), "Nothing to invoice.") + `<button class="t-link d-more" onclick="goFilter('toinvoice')">Open in Job Log</button>`; break;
    case "paid": title = "Awaiting payment"; body = rows(unpaid, j => cRow(j, {extra: j.invoiceNo ? `<span class="c-dim" style="white-space:nowrap">${esc(j.invoiceNo)}</span>` : ""}), "Nothing awaiting payment.") + `<button class="t-link d-more" onclick="goFilter('unpaid')">Open in Job Log</button>`; break;
    case "turn": title = "Turnaround: visit to report sent";
      body = `<div style="display:flex;gap:36px;margin:2px 0 6px">${[["Last 7 days", wkStats], ["This month", moStats]].map(([lbl, s]) => `<div><div class="t-big" style="color:${tc(s)}">${s ? s.pct+"%" : "–"}</div><div class="c-dim" style="font-size:12.5px;margin-top:4px">${lbl}${s ? " · on time · avg "+s.avg+"h · "+s.n+" report"+(s.n===1?"":"s") : " · no reports yet"}</div></div>`).join("")}</div>` + note("Targets: check-outs 48h, everything else 72h. Counts reports moved to Sent from 11 Oct on."); break;
  }

  // Next 7 days, compact
  const days = [];
  for (let i=1; i<=7; i++){ const iso = isoToday(i); days.push({ iso, d: new Date(iso+"T00:00:00"), jobs: active.filter(j => j.date === iso).sort(byTime) }); }
  const week = days.map(x => { const wk = x.d.getDay()===0 || x.d.getDay()===6;
    return `<div class="wk-day d-wk${wk?' wk-end':''}">
      <div class="wk-head"><span>${x.d.toLocaleDateString("en-GB",{weekday:"short"})}</span> ${x.d.getDate()}<button class="wk-add d-add" onclick="openNewOnDate('${x.iso}')" title="Add a job on this day">+</button></div>
      ${x.jobs.length ? x.jobs.map(j => { const sm = statusMeta(j.status); return `<button class="wk-job d-wkjob" style="border-left-color:${sm.fg}" onclick="openEdit('${j.id}')" title="${esc(j.jobNo||"")} · ${esc(fullAddress(j))}${j.client ? " · "+esc(j.client) : ""}">
          <div class="wk-t">${esc(j.time||"Any time")} · ${esc(typeMeta(j.type).code)}</div><div class="wk-c">${esc(j.postcode||j.address||"")}</div></button>`; }).join("") : `<div class="wk-free">Free</div>`}
    </div>`; }).join("");

  return `${helpBox(`The <b>tiles</b> count what needs doing. <b>Click a tile</b> to see its list in the panel at the bottom. <b>Click a job</b> to open it. <b>Click a coloured stage pill</b> to move that job on one step (Booked → Processing → Completed → Sent → Signed). The <b>+</b> on a day adds a job on that day. Hover over anything on a PC for a short explanation.`)}<div class="d-tiles">${tileHtml}</div>
    <div class="d-row">
      <div class="t-card d-card">
        <h3>Today <span class="count">${route ? `<a href="${route}" target="_blank" rel="noopener" class="d-route"${tip("Opens Google Maps with today's jobs as stops, in time order")}>Today's route</a>` : ""}${todays.length} job${todays.length===1?"":"s"}</span></h3>
        ${todays.length ? todays.map(j => cRow(j, {timeOnly:true}) + todayInfo(j)).join("") : `<div class="t-empty">Nothing booked for today.</div>`}
      </div>
      <div class="t-card d-card">
        <h3>Next 7 days <span class="count">${coming.length} job${coming.length===1?"":"s"}</span></h3>
        <div class="wk-strip">${week}</div>
      </div>
    </div>
    <div class="t-card d-card d-panel">
      <h3>${esc(title)}</h3>
      ${body}
    </div>`;
}

function renderCalendar(){
  const y = state.calYear, m = state.calMonth;
  const jobsByDate = {};
  baseFilteredJobs().forEach(j=>{ if (j.date){ (jobsByDate[j.date] = jobsByDate[j.date] || []).push(j); } });
  const numDays = daysInMonth(y,m);
  const leading = firstWeekdayMonIdx(y,m);
  const cells = [];
  for (let i=0;i<leading;i++) cells.push(null);
  for (let d=1; d<=numDays; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  const todayIso = TODAY.getFullYear()+"-"+pad2(TODAY.getMonth()+1)+"-"+pad2(TODAY.getDate());
  const monthName = new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  const weekdayLabels = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  return `${helpBox(`<b>Click an empty part of a day</b> to add a job on that date. <b>Click a job</b> to open it. The colour shows its stage. Prev / Next change month, Today comes back.`)}<div class="cal-wrap">
    <div class="cal-nav">
      <button class="btn btn-ghost btn-sm" onclick="calNav(-1)">&larr; Prev</button>
      <div class="cal-title">${monthName}</div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="calToday()">Today</button>
        <button class="btn btn-ghost btn-sm" onclick="calNav(1)">Next &rarr;</button>
      </div>
    </div>
    <div class="cal-grid cal-weekdays">
      ${weekdayLabels.map(w=>`<div class="cal-weekday">${w}</div>`).join("")}
    </div>
    <div class="cal-grid">
      ${cells.map(d=>{
        if (d===null) return `<div class="cal-cell cal-cell-empty"></div>`;
        const iso = isoDate(y,m,d);
        const dayJobs = (jobsByDate[iso]||[]).slice().sort((a,b)=> (a.time||"").localeCompare(b.time||""));
        const isToday = iso === todayIso;
        return `<div class="cal-cell ${isToday?"cal-cell-today":""}" onclick="calCellClick('${iso}')" title="Click to add a job on ${formatDate(iso)}">
          <div class="cal-daynum">${d}</div>
          <div class="cal-jobs">
            ${dayJobs.map(j=>{
              const sm = statusMeta(j.status), tm = typeMeta(j.type);
              const label = [j.time, tm.code, j.client].filter(Boolean).map(esc).join(" &middot; ");
              const tooltip = [tm.label, j.client, fullAddress(j)].filter(Boolean).join(" — ");
              return `<button class="cal-job-pill" style="background:${sm.bg}; color:${sm.fg};" onclick="event.stopPropagation(); openEdit('${j.id}')" title="${esc(tooltip)}">${label}</button>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}
